- id: midtarsal-mobility
  type: test
  title: Midtarsal (Chopart) Joint Mobility Assessment
  page: 3
  steps:
  - Position patient supine with foot relaxed.
  - Stabilize calcaneus and talus with proximal hand to fix hindfoot.
  - Grasp navicular and cuboid bones firmly with distal hand.
  - Mobilize midtarsal complex into dorsiflexion, plantarflexion, adduction, and abduction.
  - Grade mobility as hypomobile, normal, or hypermobile.
  positive: Midfoot stiffness, pain reproduction, or excessive laxity indicating ligamentous
