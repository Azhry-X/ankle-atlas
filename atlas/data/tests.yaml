    (eliminates acute guarding).
  - 'Item 1: Palpation pain localized to the anterior talofibular ligament (ATFL).'
  - 'Item 2: Presence of lateral ankle hematoma / cutaneous discoloration.'
  - 'Item 3: Positive anterior drawer test demonstrating mechanical laxity or soft
    end-feel.'
  - 'Adjunct test: Talar tilt test for calcaneofibular ligament (CFL) compromise.'
  - 'Cluster interpretation: presence of all 3 positive items predicts complete ATFL
    rupture.'
