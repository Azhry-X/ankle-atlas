- id: slhr-test
  type: test
  title: Single-Leg Heel Raise Test (60 bpm Protocol)
  page: 3
  steps:
  - Set auditory metronome to 60 bpm (1 beat up, 1 beat down = 30 repetitions/min).
  - Patient stands barefoot on one leg on flat ground (or slightly inclined wedge).
  - Maximum 2 fingertips placed on wall at shoulder height for balance only (no weight-bearing
    through fingers).
  - Instruct patient to perform full-height plantarflexion rises to metronome beat
    until termination.
  - Record total repetitions, peak rise height (cm), and termination reason (fatigue,
    pain, cadence loss, height reduction).
  positive: Repetitions below gender normative thresholds or Limb Symmetry Index (LSI)
    < 90%.
  metrics: 'Males 32–37 · Females 27–31 · Athletes ≥ 38–45+ reps | LSI % | Termination:
    Fatigue, Pain, Cadence, Height ↓'
  video_url: null
  image: null
  sources:
  - Hébert-Losier K et al. (2009)
  - Hébert-Losier K et al. (2017)
  review_status: draft
- id: slhr-protocol
  type: info
  title: Single-Leg Heel Raise 60 bpm Protocol
  page: 3
  steps:
  - 'Standardized cadence: 60 beats/min (30 complete cycles/minute, 1 s concentric,
    1 s eccentric).'
  - 'Balance support: strictly index and middle fingers on wall at shoulder height;
    no pushing off.'
  - 'Knee position: maintain full knee extension throughout all repetitions.'
  - 'Termination criteria: (1) voluntary cessation due to fatigue, (2) pain > 3/10,
    (3) failure to maintain cadence for 2 consecutive beats, (4) rise height dropping
    > 50% of initial height.'
  - Calculate Total Work = Repetitions × Maximum Height (cm); calculate LSI % = (Involved
    / Uninvolved) × 100.
  positive: Validates triceps surae endurance capacity; essential clearance gate for
    running and sport.
  metrics: 'Cadence: 60 bpm · Males 32–37 · Females 27–31 · Athletes ≥ 38–45+ · LSI
    ≥ 90%'
  video_url: null
  image: null
  sources:
  - Hébert-Losier K et al. (2017) J Sci Med Sport
