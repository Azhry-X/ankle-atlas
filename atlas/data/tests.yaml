- id: squeeze-test
  type: test
  title: Squeeze Test of the Leg (Hopkins Squeeze)
  page: 4
  steps:
  - Patient seated or supine with lower leg exposed and relaxed.
  - Place hands across the proximal to middle third of the calf (midway between knee
    and ankle).
  - Apply firm, gradual compression squeezing the fibula toward the tibia.
  - Release compression gradually.
  - 'Inquire where the patient feels pain: syndesmotic positive requires pain localized
    distally at the ankle.'
  positive: 'Compression at mid-calf reproduces distal syndesmotic pain at the anterior
    inferior tibiofibular joint. (Note: Low sensitivity — a negative squeeze does
    NOT exclude syndesmotic injury).'
  metrics: 'Squeeze test (Hopkins) (+): High specificity for high ankle sprain · Low
    sensitivity — a negative squeeze does NOT exclude syndesmotic injury.'
