- id: calcaneal-glides
  type: test
  title: Calcaneal Glides (Medial / Lateral Subtalar Play)
  page: 3
  steps:
  - Place patient in sidelying or prone with ankle relaxed in neutral.
  - Firmly stabilize distal tibia and fibula with proximal hand.
  - Grasp calcaneus firmly with thenar eminence of mobilizing hand.
  - Apply perpendicular medial translatory glide to the calcaneus on the talus.
  - Apply lateral translatory glide and grade end-feel as hypomobile, normal, or hypermobile.
  positive: Pain reproduction or significant hypomobility / hypermobility compared
    to contralateral limb.
