- id: royal-london-test
  type: test
  title: Royal London Hospital Test
  page: 4
  steps:
  - Patient prone with ankles hanging freely over the table edge.
  - Palpate the Achilles tendon from 2 to 6 cm proximal to insertion to locate the
    point of maximal tenderness.
  - Keep thumb and index finger precisely on the tender nodule in plantarflexed relaxation.
  - Instruct the patient to actively (or passively) maximally dorsiflex the ankle.
  - Re-palpate the identical spot in full dorsiflexion and ask whether pain is unchanged
    or significantly reduced.
  positive: Tenderness is marked in neutral/PF but significantly diminishes or completely
    disappears in full DF.
  metrics: 'Component of Achilles Midportion Cluster. Cluster-level accuracy only
    — see #achilles-midportion-cluster. No standalone accuracy figure quoted.'
  video_url: https://www.youtube.com/watch?v=VEOL0tX2rcQ
  image: null
