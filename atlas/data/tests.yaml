  - 'Criterion 2: Supra- and infra-lateral malleolar curvature comparison.'
  - 'Criterion 3: Calcaneal frontal plane angle (inverted = negative, everted = positive).'
  - 'Criterion 4: Bulging in the region of the talonavicular joint.'
  - 'Criterion 5: Height and congruence of the medial longitudinal arch.'
