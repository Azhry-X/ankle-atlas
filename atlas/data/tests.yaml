- id: first-mtp-extension
  type: test
  title: 1st MTP Joint Extension (NWB vs WB / Jack's Test)
  page: 3
  steps:
  - 'Non-weight-bearing (NWB): patient seated; passively extend hallux at 1st MTP
    joint (normative 60–65° for gait, 70–90° for sprinting).'
  - 'Weight-bearing (WB / Jack''s test): patient standing in bilateral stance with
    equal weight.'
  - Manually dorsiflex the hallux by lifting from under the distal phalanx.
  - Observe whether the medial longitudinal arch elevates and the tibia externally
    rotates (Windlass mechanism).
  - Note any block or pain during extension.
  positive: NWB < 30° indicates Hallux Rigidus; NWB ≥ 60° with WB restricted indicates
    Functional Hallux Limitus.
  metrics: 1st MTP Extension — NWB (°) ≥ 60–65° gait · 70–90° sprinting | Functional
    Hallux Limitus (≥ 60° NWB, ↓ WB) · Hallux Rigidus (< 30°)
