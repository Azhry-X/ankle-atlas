  page: 7
  type: info
  review_status: draft
  evidence: M
  summary: Clinical trial and CPG evidence for dry needling in plantar heel pain and chronic ankle instability alongside prospective
    adverse-event rates and anticoagulant precautions.
  steps:
  - 'Dry needling for plantar heel pain (Cotchett 2014 RCT, 1 per week × 6): first-step pain −14.4 mm vs sham (below minimal
    important difference); NNT 4; minor transient adverse events 32%.'
  - 'JOSPT CPGs: dry needling of the fibularis group with proprioceptive training for CAI (C) (Martin 2021); "dry needling
    to MTrP in the gastrocnemius, soleus, and plantar muscles" for short- and long-term pain (B) (Koc 2023).'
  - 'Adverse events — 7,629 treatments (Brady 2014): mild AEs 19.18 %; upper risk rate for significant AEs ≤ 0.04 %; bruising
    7.55 %, bleeding 4.65 %.'
  - 'Adverse events — 20,464 treatments (Boyce 2020): minor AE 36.7 %; major AE < .1 %; most common major: prolonged symptom
    aggravation .03 %, fainting .02 %, forgotten needles .01 %; major AEs most often with gluteal, lumbar paraspinal, suboccipital
    and upper trapezius needling.'
  - 'Known serious risks (Halle 2016): pneumothorax, cardiac tamponade, haematoma, infection, CNS injury; filament needles
    32–36 gauge (.25–.20 mm).'
  - 'Anticoagulants / coagulopathy (Kearns 2019): caution — possible increased incidence or severity of haematoma and bruising.'
