  evidence: E
  summary: Limb Symmetry Index calculation (LSI % = involved ÷ uninvolved × 100) for HHD strength, single-leg heel-rise, and
    hop testing.
  steps:
  - Record the involved and uninvolved limb scores using identical test conditions.
  - Compute LSI % = involved ÷ uninvolved × 100.
  - Interpret LSI alongside uninvolved limb capacity and movement quality.
  positive: Quantifies side-to-side symmetry (%) for strength, heel-rise endurance, and functional hop performance.
  interpretation: 'Expert clinical calculation (E): LSI % = involved ÷ uninvolved × 100.'
  metrics: LSI % = involved ÷ uninvolved × 100 (E)
  calculator:
    kind: formula
    decimals: 1
    value_label: '% LSI (involved ÷ uninvolved × 100)'
    expr: '(uninv > 0 && inv >= 0) ? (inv / uninv * 100) : NaN'
    inputs:
    - heading: Limb Symmetry Index — involved ÷ uninvolved × 100
    - key: inv
      label: Involved limb value
      type: number
    - key: uninv
      label: Uninvolved limb value
      type: number
    outputs:
    - when: v >= 0
      text: 'LSI: {v|1}% (involved {inv|1} ÷ uninvolved {uninv|1} × 100)'
      tone: good
  sources: []
- id: van-dijk-cluster
  title: Delayed Physical Examination After Sprain (Day 5, van Dijk 1996) & JOSPT CPG Diagnosis
  page: 4
  type: info
  review_status: draft
  evidence: M
  summary: Accuracy of delayed physical examination at day 5 after acute lateral ankle sprain (van Dijk 1996) and JOSPT 2021
    CPG diagnostic recommendations.
  steps:
  - Perform delayed physical examination at day 5 post-sprain (palpation, haematoma, anterior drawer) once acute swelling
    and guarding subside (van Dijk 1996).
  - 'Follow JOSPT LAS CPG (Martin 2021): "Clinicians should use special tests, including the reverse anterolateral drawer
    test and anterolateral talar palpation in addition to the traditional anterior drawer test" (B).'
  - 'For chronic ankle instability (Martin 2021): use a discriminative instrument "such as the Cumberland Ankle Instability
    Tool or the Identification of Functional Ankle Instability" plus functional performance tests (B).'
  positive: Delayed physical examination (day 5) has sensitivity 96% and specificity 84% for a lateral ligament lesion (van
    Dijk 1996).
  interpretation: 'van Dijk 1996: delayed physical examination after sprain (day 5) sensitivity 96%, specificity 84% for a
    ligament lesion; kappa 0.5–1.0. Martin 2021 JOSPT LAS CPG: "Clinicians should use special tests, including the reverse
    anterolateral drawer test and anterolateral talar palpation in addition to the traditional anterior drawer test" (B).'
  metrics: 'Delayed exam (day 5): sensitivity 96%, specificity 84%, kappa 0.5–1.0 (van Dijk 1996) · JOSPT LAS CPG diagnosis
    (B) (Martin 2021)'
  sources:
  - text: van Dijk 1996 J Bone Joint Surg Br
    url: https://doi.org/10.1302/0301-620x78b6.1283
  - text: Martin 2021 J Orthop Sports Phys Ther (lateral ankle sprain CPG)
    url: https://doi.org/10.2519/jospt.2021.0302
