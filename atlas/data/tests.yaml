  type: test
  review_status: draft
  evidence: M
  video_url: https://www.youtube.com/watch?v=U7woPNLUT3Q
  video_title: The Weight Bearing Lunge Test or Wall Test / Ankle Mobility — Physiotutors
  summary: Closed-chain weight-bearing ankle dorsiflexion measurement recorded as toe-to-wall distance or tibial inclinometer
    angle.
  steps:
  - Place the patient's test foot perpendicular to a wall and ask them to lunge the knee forward to touch the wall while keeping
