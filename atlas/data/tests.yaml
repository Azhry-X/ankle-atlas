- id: slhr-test
  title: Single-Leg Heel-Rise Test (10° Incline, to Fatigue)
  page: 3
  type: test
  review_status: draft
  evidence: M
  summary: Triceps surae endurance test performed on a 10° incline to fatigue (Hébert-Losier 2017) and recommended as an impairment/outcome
    test in Achilles tendinopathy (Martin 2018).
  steps:
  - Position the patient standing barefoot on a 10° incline with light fingertip touch on the wall for balance.
