  type: info
  title: Navicular Drop Measurement & Pronation Cutoffs
  page: 3
  steps:
  - 'Understand clinical rationale: measures sag of the medial longitudinal arch under
    static full body weight.'
  - Carefully establish subtalar neutral in seated/standing before measuring baseline
    height.
  - Measure vertical drop using a millimeter ruler or index card.
  - 'Normal mobility: 6–10 mm of sag.'
  - 'Rigid/hypomobile arch: < 5 mm; Hyperpronating foot: > 10–15 mm.'
  positive: Identifies dynamic arch collapse and excessive midfoot pronation (triplanar).
  metrics: 'Normal: 6–10 mm · Excessive pronation: > 10 mm'
