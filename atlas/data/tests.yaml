- id: navicular-drop-test
  type: test
  title: Navicular Drop Test
  page: 3
  steps:
  - Patient seated with foot flat on floor and subtalar joint positioned in neutral
    (talar head congruence).
  - Mark the most prominent point of the navicular tuberosity with an indelible skin
    marker.
  - Place an index card perpendicular to the floor against the medial foot; mark baseline
    navicular height.
  - Instruct the patient to stand fully, distributing weight equally in relaxed bilateral
    stance.
  - Mark the new standing navicular position on the card; measure displacement in
    millimeters.
  positive: Navicular displacement > 10 mm indicates excessive pronation (normal range
    6–10 mm).
  metrics: 'Navicular Drop Test (mm): Normal 6–10 mm · Hyperpronation > 10 mm'
