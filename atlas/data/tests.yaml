- id: fpi-6-test
  title: Foot Posture Index (FPI) — Standing Foot Posture
  page: 3
  type: test
  review_status: draft
  evidence: M
  summary: Multi-segment clinical observation of standing foot posture across rearfoot and forefoot planes with normative
    reference values (Redmond 2008, Rokkedal-Lausch 2013).
  steps:
  - Have the patient stand in relaxed bilateral stance.
  - Assess talar head palpation, supra/infralateral malleolar curvature, calcaneal frontal-plane position, talonavicular prominence,
    medial longitudinal arch congruence, and forefoot abduction/adduction.
  - Compare total score and left–right symmetry against normative adult data.
  positive: Healthy adults are slightly pronated (mean score +4) with a normal left–right difference of −2 to +2 (Redmond
    2008; Rokkedal-Lausch 2013).
  interpretation: 'Redmond 2008 & Rokkedal-Lausch 2013: healthy adults: slightly pronated, mean score +4; normal left–right
    difference −2 to +2.'
  metrics: 'Healthy adults: slightly pronated, mean score +4; normal left–right difference −2 to +2 (Redmond 2008 · Rokkedal-Lausch
    2013)'
