- id: silfverskiold-test
  type: test
  title: Silfverskiöld Test (Gastrocnemius vs Soleus Isolation)
  page: 3
  steps:
  - Position the patient supine or seated with knee fully extended (0°).
  - Lock the subtalar joint in neutral/inversion with one hand to prevent midtarsal
    collapse.
  - Measure maximum passive ankle dorsiflexion using goniometry or inclinometer.
  - Flex the knee to 90° (slackening gastrocnemius heads).
  - Re-measure passive ankle dorsiflexion with subtalar joint kept in neutral.
  - Calculate dorsiflexion gain from knee 0° to 90°.
  positive: Gain ≥ 10° DF with knee flexed indicates isolated gastrocnemius contracture;
    Gain < 5° indicates soleus/capsular restriction.
  metrics: Silfversköld — DF Knee 0° (°) Gastrocnemius + soleus length | DF Knee 90°
    (°) Soleus / capsular length | Gain ≥ 10° (Gastroc) · Gain < 5° (Soleus/Capsule)
  video_url: null
  image: null
  sources:
  - Silfverskiöld N (1924)
  - DiGiovanni CW et al. (2002)
  review_status: draft
- id: silfverskiold-info
  type: info
  title: Silfverskiöld Interpretation & Differential
  page: 3
  steps:
  - 'Understand biomechanical anatomy: gastrocnemius crosses knee and ankle (biarticular);
    soleus crosses ankle only (monoarticular).'
  - 'At knee 0° (extended): both gastrocnemius and soleus contribute to dorsiflexion
    resistance.'
  - 'At knee 90° (flexed): gastrocnemius is slackened across the knee joint.'
  - 'Gain ≥ 10°: isolated gastrocnemius tightness. Management: gastrocnemius lengthening
    / straight-leg stretching.'
  - 'Gain < 5°: soleus hypertonicity, Achilles structural shortening, or talocrural
    joint capsular contracture.'
  positive: Differentiates isolated gastrocnemius contracture from soleus/capsular
    joint restriction.
  metrics: Gain ≥ 10° = Isolated Gastrocnemius · Gain < 5° = Soleus / Capsule
  video_url: null
  image: null
  sources:
  - DiGiovanni CW et al. (2002)
  - Barske HL et al. (2012)
  review_status: draft
- id: subtalar-rom
  type: test
  title: Subtalar Joint Inversion & Eversion ROM
  page: 3
  steps:
  - Position the patient in prone with feet extending over the examination table edge.
  - Align goniometer stationary arm along posterior midline of the lower leg.
  - Align movable arm along posterior midline of the calcaneus.
  - Passively invert the calcaneus to end range and record degrees (normative 20–30°).
  - Passively evert the calcaneus to end range and record degrees (normative 10–15°).
  - Calculate inversion-to-eversion ratio (normal ratio 2:1).
  positive: Severe restriction of inversion/eversion, asymmetry > 5°, or deviation
    from 2:1 ratio.
  metrics: 'Subtalar Inversion (°) 20–30° · Subtalar Eversion (°) 10–15° · Inv : Ev
    ratio 2 : 1'
