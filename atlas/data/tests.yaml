  page: 2
  steps:
  - Patient seated on table edge with thighs fully supported and hands clasped behind
    back.
  - Instruct patient to slump thoracic and lumbar spine while maintaining head neutral.
  - Apply gentle overpressure to shoulders; instruct patient to fully flex cervical
    spine (chin to chest).
  - While holding slump, passively extend the knee and dorsiflex the ankle.
  - 'Instruct patient to extend the cervical spine: check if leg symptoms immediately
    diminish.'
  positive: Reproduction of familiar lower extremity symptoms that decrease or resolve
    upon cervical extension.
