  - Firmly stabilize distal tibia with one hand.
  - Grasp distal lateral malleolus firmly between thumb and index finger of opposite
    hand.
  - Apply anterior and posterior translatory shear forces to the fibula on the tibia.
  - Compare excursion distance and end-feel with the contralateral limb.
  positive: Increased anterior-posterior fibular translation (> 2–3 mm difference)
