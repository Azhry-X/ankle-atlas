      type: select
      options: *id003
    - key: l14
      label: 14. Standing for 1 hour
      type: select
      options: *id003
    - key: l15
      label: 15. Sitting for 1 hour
      type: select
      options: *id003
    - key: l16
      label: 16. Running on even ground
      type: select
      options: *id003
    - key: l17
      label: 17. Running on uneven ground
      type: select
      options: *id003
    - key: l18
      label: 18. Making sharp turns while running fast
      type: select
      options: *id003
    - key: l19
      label: 19. Hopping
      type: select
      options: *id003
    - key: l20
