- id: cait
  title: CAIT (Cumberland Ankle Instability Tool)
  page: 4
  type: info
  review_status: draft
  evidence: M
  summary: 9-item discriminative questionnaire (total 0–30) quantifying perceived functional / chronic ankle instability (Hiller
    2006, Wright 2014).
  steps:
  - Administer the 9 items of the CAIT for the involved ankle (total score 0–30).
  - Apply the recalibrated threshold ≤ 25 for chronic ankle instability (CAI, Wright 2014) and compare with the 27.5 original
    threshold (Hiller 2006).
  - Combine with functional performance tests as recommended by the JOSPT 2021 lateral ankle sprain CPG (B).
  positive: Score ≤ 25 identifies chronic ankle instability (sensitivity 96.6%, specificity 86.8%, Wright 2014); original
    threshold 27.5 (sensitivity 82.9%, specificity 74.7%, Hiller 2006).
  interpretation: 'Hiller 2006 & Wright 2014: original threshold 27.5 (sensitivity 82.9%, specificity 74.7%), ICC .96; recalibrated
    ≤25 for CAI: sensitivity 96.6%, specificity 86.8%. Martin 2021 JOSPT LAS CPG: use a discriminative instrument "such as
    the Cumberland Ankle Instability Tool or the Identification of Functional Ankle Instability" plus functional performance
    tests (B).'
  metrics: 'Original threshold 27.5 (sensitivity 82.9%, specificity 74.7%), ICC .96 (Hiller 2006) · Recalibrated ≤25 for CAI:
    sensitivity 96.6%, specificity 86.8% (Wright 2014) · JOSPT LAS CPG (B) (Martin 2021)'
  calculator:
    kind: formula
    decimals: 0
    value_label: / 30 CAIT Score (≤ 25 CAI, Wright 2014; 27.5 original threshold, Hiller 2006)
    expr: c1+c2+c3+c4+c5+c6+c7+c8+c9
    inputs:
    - heading: Cumberland Ankle Instability Tool (CAIT — 9 items, total 0–30)
    - key: c1
      label: 1. I have pain in my ankle
      type: select
      options:
      - - '5'
        - 5 — Never
      - - '4'
        - 4 — During sport
      - - '3'
        - 3 — Running on uneven surfaces
      - - '2'
        - 2 — Running on level surfaces
      - - '1'
        - 1 — Walking on uneven surfaces
      - - '0'
        - 0 — Walking on level surfaces
    - key: c2
      label: 2. My ankle feels UNSTABLE
      type: select
      options:
      - - '4'
        - 4 — Never
      - - '3'
        - 3 — Sometimes during sport (not every time)
      - - '2'
        - 2 — Frequently during sport (every time)
      - - '1'
        - 1 — Sometimes during daily activities
      - - '0'
        - 0 — Frequently during daily activities
    - key: c3
      label: 3. When I make SHARP turns, my ankle feels UNSTABLE
      type: select
      options:
      - - '3'
        - 3 — Never
      - - '2'
        - 2 — Sometimes when running
      - - '1'
        - 1 — Often when running
      - - '0'
        - 0 — When walking
    - key: c4
      label: 4. When going down the stairs, my ankle feels UNSTABLE
      type: select
      options:
      - - '3'
        - 3 — Never
      - - '2'
        - 2 — If I go fast
      - - '1'
        - 1 — Occasionally
      - - '0'
        - 0 — Always
    - key: c5
      label: 5. My ankle feels UNSTABLE when standing on ONE leg
      type: select
      options:
      - - '2'
        - 2 — Never
      - - '1'
        - 1 — On the ball of my foot
      - - '0'
        - 0 — With my foot flat
    - key: c6
      label: 6. My ankle feels UNSTABLE when
      type: select
      options:
      - - '3'
        - 3 — Never
      - - '2'
        - 2 — I hop from side to side
      - - '1'
        - 1 — I hop on the spot
      - - '0'
        - 0 — When I jump
    - key: c7
      label: 7. My ankle feels UNSTABLE when
      type: select
      options:
      - - '4'
        - 4 — Never
      - - '3'
        - 3 — I run on uneven surfaces
      - - '2'
        - 2 — I jog on uneven surfaces
      - - '1'
        - 1 — I walk on uneven surfaces
      - - '0'
        - 0 — I walk on a flat surface
    - key: c8
      label: 8. TYPICALLY, when I start to roll over (or 'twist') on my ankle, I can stop it
      type: select
      options:
      - - '3'
        - 3 — Immediately
      - - '2'
        - 2 — Often
      - - '1'
        - 1 — Sometimes
      - - '0'
        - 0 — Never
      - - '3'
        - 3 — I have never rolled over on my ankle
    - key: c9
      label: 9. Following a TYPICAL incident of my ankle rolling over, my ankle returns to 'normal'
      type: select
      options:
      - - '3'
        - 3 — Almost immediately
      - - '2'
        - 2 — Less than one day
      - - '1'
        - 1 — 1–2 days
      - - '0'
        - 0 — More than 2 days
      - - '3'
        - 3 — I have never rolled over on my ankle
    outputs:
    - when: v <= 25
      text: 'CAIT: {v|0} / 30 — ≤ 25 CAI (Wright 2014: Sn 96.6%, Sp 86.8%) · 27.5 original threshold (Hiller 2006: Sn 82.9%,
        Sp 74.7%, ICC .96)'
      tone: bad
    - when: v > 25 && v < 27.5
      text: 'CAIT: {v|0} / 30 — above ≤ 25 CAI (Wright 2014) and below 27.5 original threshold (Hiller 2006)'
      tone: warn
    - when: v >= 27.5
      text: 'CAIT: {v|0} / 30 — above ≤ 25 CAI (Wright 2014) and ≥ 27.5 original threshold (Hiller 2006)'
      tone: good
  sources:
  - text: Hiller 2006 Arch Phys Med Rehabil
    url: https://doi.org/10.1016/j.apmr.2006.05.022
  - text: Wright 2014 Arch Phys Med Rehabil
    url: https://doi.org/10.1016/j.apmr.2014.04.017
  - text: Martin 2021 J Orthop Sports Phys Ther (lateral ankle sprain CPG)
    url: https://doi.org/10.2519/jospt.2021.0302
- id: visa-a
  title: VISA-A (Victorian Institute of Sport Assessment–Achilles)
  page: 4
  type: info
  review_status: draft
  evidence: M
  summary: 8-item Achilles tendinopathy severity questionnaire scored from 0 to 100 points (Robinson 2001, Martin 2018).
  steps:
  - Administer the 8 items covering morning stiffness, pain with stretching/walking/stairs/heel raises, single-leg hopping,
    and sport participation (total 0–100).
  - Use as the primary patient-reported outcome measure in midportion Achilles tendinopathy (JOSPT CPG grade A, Martin 2018).
  positive: Test–retest r = 0.93; controls exceeded 96 (Robinson 2001).
  interpretation: 'Robinson 2001: test–retest r = 0.93; controls exceeded 96. Martin 2018 JOSPT midportion Achilles tendinopathy
    CPG: "Clinicians should use the Victorian Institute of Sport Assessment-Achilles (VISA-A)" and either the FAAM or the
    LEFS (A); hop and heel-raise endurance tests (B).'
  metrics: Test–retest r = 0.93; controls exceeded 96 (Robinson 2001) · JOSPT Achilles CPG (A) (Martin 2018)
  calculator:
    kind: formula
    decimals: 0
    value_label: '/ 100 VISA-A Score (Robinson 2001: test–retest r = 0.93; controls exceeded 96)'
    expr: v1+v2+v3+v4+v5+v6+v7+v8
    inputs:
    - heading: 'VISA-A — 8 items (items 1–7: 0–10; item 8: one of A / B / C, maximum 30; total 0–100)'
    - key: v1
      label: 1. Morning stiffness duration (10 = 0 mins, 0 = 100 mins)
      type: select
      options: &id002
      - - '10'
        - 10 / 10
      - - '9'
        - 9 / 10
      - - '8'
        - 8 / 10
      - - '7'
        - 7 / 10
      - - '6'
        - 6 / 10
      - - '5'
        - 5 / 10
      - - '4'
        - 4 / 10
      - - '3'
        - 3 / 10
      - - '2'
        - 2 / 10
      - - '1'
        - 1 / 10
      - - '0'
        - 0 / 10
    - key: v2
      label: 2. Pain stretching Achilles over edge of step (10 = no pain, 0 = strong severe pain)
      type: select
      options: *id002
    - key: v3
      label: 3. Pain after walking on flat ground for 30 minutes (10 = no pain, 0 = strong severe pain)
      type: select
      options: *id002
    - key: v4
      label: 4. Pain walking downstairs with normal gait cycle (10 = no pain, 0 = strong severe pain)
      type: select
      options: *id002
    - key: v5
      label: 5. Pain during or immediately after 10 single-leg heel raises (10 = no pain, 0 = strong severe pain)
      type: select
      options: *id002
    - key: v6
      label: 6. Single-leg hops without pain (10 = 10 hops, 0 = 0 hops)
      type: select
      options: *id002
    - key: v7
      label: 7. Are you currently undertaking sport or other physical activity?
      type: select
      options:
      - - '0'
        - 0 — Not at all
      - - '4'
        - 4 — Modified training ± modified competition
      - - '7'
        - 7 — Full training ± competition, but not at the same level as when symptoms began
      - - '10'
        - 10 — Competing at the same or higher level as when symptoms began
    - key: v8
      label: '8. Answer ONE of A, B or C — how long can you train / practise in Achilles-loading sport?'
      type: select
      options:
      - - '0'
        - A (no pain while training) — nil = 0
      - - '7'
        - A — 1–10 min = 7
      - - '14'
        - A — 11–20 min = 14
      - - '21'
        - A — 21–30 min = 21
      - - '30'
        - A — more than 30 min = 30
      - - '0'
        - B (some pain, but it does not stop me completing training) — nil = 0
      - - '4'
        - B — 1–10 min = 4
      - - '10'
        - B — 11–20 min = 10
      - - '14'
        - B — 21–30 min = 14
      - - '20'
        - B — more than 30 min = 20
      - - '0'
        - C (pain stops me completing training) — nil = 0
      - - '2'
        - C — 1–10 min = 2
      - - '5'
        - C — 11–20 min = 5
      - - '7'
        - C — 21–30 min = 7
      - - '10'
        - C — more than 30 min = 10
    outputs:
    - when: v >= 0
      text: 'VISA-A Score: {v|0} / 100 · Robinson 2001: test–retest r = 0.93; controls exceeded 96'
      tone: good
  sources:
  - text: Robinson 2001 Br J Sports Med
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1724384/
    free_full_text: true
  - text: Martin 2018 J Orthop Sports Phys Ther (midportion Achilles tendinopathy CPG)
    url: https://doi.org/10.2519/jospt.2018.0302
- id: lefs
  title: LEFS (Lower Extremity Functional Scale)
  page: 4
  type: info
  review_status: draft
  evidence: M
  summary: 20-item lower-extremity functional disability scale scored 0–4 per item (total 0–80 points; Binkley 1999).
  steps:
  - Rate 20 lower-extremity functional activities from 0 (unable to perform) to 4 (no difficulty) and sum for a total of 0–80
    points.
  - Compare change across visits against Binkley 1999 MDC 9 and MCID 9 points.
  positive: Change of 9 points or more meets both MDC 9 and MCID 9 points (Binkley 1999).
  interpretation: 'Binkley 1999: test–retest R = .94; MDC 9 and MCID 9 points. Martin 2021 JOSPT LAS CPG: "Clinicians should
    use validated patient-reported outcome measures, such as the ... Foot and Ankle Ability Measure, and the Lower Extremity
    Functional Scale" (A).'
  metrics: Test–retest R = .94; MDC 9 and MCID 9 points (Binkley 1999) · JOSPT CPG (A) (Martin 2021; Martin 2018)
  calculator:
    kind: formula
    decimals: 0
    value_label: / 80 LEFS Score (MDC 9 and MCID 9 points, Binkley 1999)
    expr: l1+l2+l3+l4+l5+l6+l7+l8+l9+l10+l11+l12+l13+l14+l15+l16+l17+l18+l19+l20
