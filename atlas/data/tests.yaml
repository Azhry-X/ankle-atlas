  interpretation: 'Bennell 1998: intra-rater ICC 0.97–0.98; inter-rater ICC 0.97 (angle) and 0.99 (distance). Martin 2021
    JOSPT LAS CPG recommends measuring dorsiflexion "using the weight-bearing lunge test" (A).'
  metrics: Intra-rater ICC 0.97–0.98; inter-rater ICC 0.97 (angle) and 0.99 (distance) (Bennell 1998) · JOSPT LAS CPG (A)
    (Martin 2021)
