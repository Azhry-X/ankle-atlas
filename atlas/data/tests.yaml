- id: lisfranc
  type: test
  title: Lisfranc Tarsometatarsal Joint Assessment
  page: 1
  steps:
  - Inspect plantar midfoot for hallmark ecchymosis ('bruise sign').
  - Stabilize hindfoot with one hand, grasp metatarsal head with opposite hand.
  - Apply alternating dorsal and plantar passive stress (piano-key test).
  - Palpate 1st–2nd metatarsal base interspace for diastasis and focal tenderness.
  - Perform passive pronation-abduction stress across the midfoot.
  positive: Severe focal midfoot pain, palpable diastasis, or gross instability on
    piano-key testing.
  metrics: High-Risk Fracture Checklist [L*] — Plantar ecchymosis · Piano-key · 1st–2nd
    MT diastasis
  video_url: https://youtu.be/0ugLq8Ns5VU
  image: null
  sources:
  - Physiotutors
  - Englanoff et al. (1995)
  - Myerson et al. (1986)
  review_status: draft
- id: thompson
  type: test
  title: Thompson Test (Calf Squeeze Test)
  page: 1
  steps:
  - Position the patient in prone with feet hanging freely over the table edge (or
    kneeling on a chair).
  - Ensure the calf and ankle are completely relaxed.
  - Firmly squeeze the muscular bulk of the middle third of the calf with your palm
    and fingers.
  - Observe the foot for passive ankle plantarflexion.
  - Compare bilaterally with the unaffected limb.
  positive: Absence of passive ankle plantarflexion upon calf compression indicates
    complete Achilles rupture.
  metrics: 'Achilles Rupture Emergency Triad: Thompson · Palpable Gap (2–6 cm) · Matles
    Test (prone 90°) — ≥ 2 POSITIVE (SN/SP > 98%)'
  video_url: https://www.youtube.com/watch?v=z-7cJ7LpCqY
  image: null
  sources:
  - Physiotutors
  - Thompson TC (1962)
  - Maffulli N (1998)
  review_status: draft
- id: ottawa-exclusions
  type: info
  title: Ottawa Ankle & Midfoot Rules & Exclusions
  page: 1
  steps:
  - 'Screen for exclusion criteria: age < 5, intoxication, altered mental status,
    distracting injury, gross swelling, neuropathy, presentation > 10 days post-injury.'
  - Palpate posterior edge and tip of lateral malleolus (distal 6 cm).
  - Palpate posterior edge and tip of medial malleolus (distal 6 cm).
  - Assess ability to bear weight for 4 consecutive steps immediately and at assessment.
  - 'For midfoot: palpate base of 5th metatarsal and navicular bone; assess 4-step
    weight bearing.'
  positive: Bony tenderness at specified landmarks OR inability to bear weight 4 steps
    mandates radiography.
  metrics: Malleolar Zone → Ankle Radiograph [H] SN 98% · Midfoot Zone → Foot Radiograph
    [H] SN 98%
  video_url: null
  image: null
  sources:
  - Stiell IG et al. (1993)
  - Bachmann LM et al. (2001)
  review_status: draft
- id: compartment-delta-p
  type: info
  title: Compartment Syndrome — 6 Ps & ΔP Threshold
  page: 1
  steps:
  - 'Screen for the 6 Ps: Pain out of proportion / on passive stretch, Paresthesia,
    Pallor, Paralysis, Pulselessness, Poikilothermia.'
  - Note that pain on passive stretch is the earliest and most sensitive clinical
    sign.
  - Measure diastolic blood pressure (mmHg).
  - Measure direct intracompartmental pressure using needle manometry.
  - Calculate ΔP = Diastolic BP − Compartment Pressure.
  - 'Pressure measurement is a medical procedure. PT role: recognise and refer immediately.'
  positive: ΔP ≤ 30 mmHg indicates critical tissue hypoperfusion requiring EMERGENCY
    FASCIOTOMY.
  metrics: ΔP (Diastolic BP − Compartment Pressure) = ___ mmHg → ≤ 30 mmHg = EMERGENCY
    FASCIOTOMY INDICATED
  video_url: null
  image: null
  sources:
  - McQueen MM, Court-Brown CM (1996)
  - von Keudell AG et al. (2015)
  review_status: draft
- id: charcot-neuroarthropathy
  type: info
  title: Charcot Neuroarthropathy Diagnostic Criteria
  page: 1
  steps:
  - Assess for history of peripheral neuropathy (diabetic, alcoholic, idiopathic).
  - Measure dermal temperature asymmetry between involved and contralateral limb using
    infrared thermometry.
  - 'Perform the 10-minute elevation test: observe if unilateral erythema significantly
    reduces.'
  - Palpate pedal pulses (dorsalis pedis and posterior tibial) to confirm adequate
    vascular supply.
  - Inquire regarding pain level (paradoxically minimal or absent despite florid clinical
    inflammation).
  positive: Temperature difference > 2 °C + erythema resolving on elevation + bounding
    pulses in neuropathic foot.
  metrics: Temp diff > 2 °C · Erythema reduces on 10 min elevation · Minimal/absent
    pain · Palpable pulses present → IMMEDIATE total-contact offloading + urgent referral.
    NO loading. NO manual therapy. NO ESWT.
  video_url: null
  image: null
  sources:
  - Rogers LC et al. (2011)
  - Frykberg RG et al. (2006)
  review_status: draft
- id: budapest-crps
  type: info
  title: Budapest Diagnostic Criteria for CRPS
  page: 1
  steps:
  - Verify continuing pain disproportionate to the inciting noxious event.
  - 'Assess 4 symptom categories: Sensory (hyperesthesia/allodynia), Vasomotor (temperature/color
    changes), Sudomotor/Edema (edema/sweating asymmetry), Motor/Trophic (decreased
    ROM, weakness, tremor, trophic changes).'
  - Assess the same 4 sign categories on physical examination.
  - 'Calculate positive categories: diagnostic requires ≥ 3/4 symptom categories and
    ≥ 2/4 sign categories.'
  - Rule out any other condition that could account for the degree of pain and dysfunction.
  positive: Reported symptoms in ≥ 3 of 4 categories AND demonstrated signs in ≥ 2
    of 4 categories.
  metrics: 'Budapest CRPS [H] (≥ 3/4 Sx, ≥ 2/4 Signs): Sensory · Vasomotor · Edema
    · Trophic → I / II'
  video_url: null
  image: null
  sources:
  - Harden RN et al. (2007)
  - Harden RN et al. (2010)
  review_status: draft
- id: achilles-triad
  type: info
  title: Achilles Rupture Emergency Triad
  page: 1
  steps:
  - Perform the Thompson calf squeeze test in prone.
  - Carefully palpate the Achilles tendon course 2–6 cm proximal to the calcaneus
    for a focal gap.
  - 'Perform the Matles test: observe prone knee flexion to 90°; inspect resting foot
    angle.'
  - 'Note: gap may be obscured by hematoma after 24–48 h; late negative palpation
    does not exclude rupture.'
  - If ≥ 2 tests positive, immediately immobilize in equinus boot and initiate urgent
    orthopaedic referral (< 48 h).
  positive: Presence of ≥ 2 positive findings among Thompson, palpable gap, and Matles
    test.
  metrics: '≥ 2 POSITIVE (SN/SP > 98%): Equinus boot + urgent orthopaedic referral
    (< 48 h). No loading.'
  video_url: null
  image: null
  sources:
  - Maffulli N (1998)
  - Garras DN et al. (2012)
  review_status: draft
- id: sinus-tarsi-syndrome
  type: test
  title: Sinus Tarsi Syndrome Palpation
  page: 2
  steps:
  - Position the patient in supine with ankle in neutral relaxation.
  - Identify the lateral malleolus and locate the depression 1 cm anterior and slightly
    inferior.
  - Apply firm thumb pressure into the sinus tarsi cavity.
  - Passively invert and plantarflex the foot while maintaining pressure.
  - Assess for sharp localized tenderness and instability sensation.
  positive: Focal exquisite tenderness in the sinus tarsi; diagnostic relief confirmed
    upon local lidocaine infiltration.
  metrics: Palpation 1 cm anterior to lateral malleolus; relief with lidocaine
  video_url: null
  image: null
  sources:
  - Helgeson K (2009)
  - Pisani G et al. (2004)
  review_status: draft
- id: molloy-bendall
  type: test
  title: Molloy-Bendall Sign (Anterolateral Impingement)
  page: 2
  steps:
  - Patient seated or supine with knee flexed 90° and ankle relaxed.
  - Place thumb over the anterolateral gutter of the ankle joint line.
  - Apply firm pressure into the gutter with the ankle in plantarflexion.
  - While maintaining firm thumb pressure, passively force the ankle into full maximal
    dorsiflexion.
  - Observe for pain reproduction or mechanical block.
  positive: Reproduction of sharp anterolateral pain as the hypertrophic synovial
    tissue or scar impinges between talus and fibula.
  metrics: (+) Molloy-Bendall sign (pressure + forced DF)
  video_url: null
  image: null
  sources:
  - Molloy S, Bendall SP (2003)
  - Murawski CD et al. (2014)
  review_status: draft
- id: lateral-process-talus
  type: test
  title: Lateral Process of Talus Palpation (Snowboarder's Fracture)
  page: 2
  steps:
  - Place the patient supine with foot in neutral.
  - Palpate the tip of the lateral malleolus.
  - Move fingers directly distal and anterior toward the subtalar joint.
  - Apply focal digital pressure onto the lateral process of the talus.
  - Passively evert and dorsiflex the subtalar joint.
  positive: Focal point tenderness just distal to the fibular tip, worsened by dorsiflexion
    and eversion; warrants CT imaging.
  metrics: “Snowboarder’s”; tender just distal to fibular tip
  video_url: null
  image: null
  sources:
  - Kirkpatrick DP et al. (1998)
  - McCrory P, Bladin C (1996)
  review_status: draft
- id: deltoid-ligament-sprain
  type: test
  title: Deltoid Ligament Eversion Stress & Fibular Palpation
  page: 2
  steps:
  - Position the patient seated with the lower leg stabilized.
  - Palpate along the anterior, middle, and posterior components of the medial deltoid
    complex.
  - Grasp the calcaneus and gently apply an eversion force to stress the deep deltoid
    fibers.
  - Perform external rotation of the foot on the tibia in neutral and slight dorsiflexion
    (Kleiger maneuver).
  - Always palpate the proximal fibular neck to rule out concomitant Maisonneuve fracture.
  positive: Medial joint pain, gapping, or tenderness, especially when accompanied
    by proximal fibular pain.
  metrics: Eversion stress / Kleiger ER; palpate fibular neck
  video_url: null
  image: null
  sources:
  - Hintermann B (2003)
  - Schuberth JM et al. (2004)
  review_status: draft
- id: pttd-staging
  type: test
  title: PTTD Staging & Too-Many-Toes Sign
  page: 2
  steps:
  - Inspect the patient standing from directly behind.
  - Evaluate hindfoot alignment (valgus deviation) and observe forefoot abduction.
  - 'Count visible lateral toes: more than 1.5–2 toes lateral to the calcaneus indicates
    positive Too-Many-Toes sign.'
  - Instruct the patient to perform a single-leg heel raise while observing for calcaneal
    inversion (rigid pes planus in Stage III/IV).
  - Palpate the course of the tibialis posterior tendon along the retromalleolar groove
    to the navicular.
  positive: Forefoot abduction (> 1.5–2 toes visible laterally), failure of calcaneal
    inversion on heel raise, or rigid deformity.
  metrics: 'PTTD Staging: I Tenosynovitis · II Flexible flatfoot / “Too-Many-Toes”
    · III Rigid pes planus · IV Ankle valgus'
  video_url: null
  image: null
  sources:
  - Johnson KA, Strom DE (1989)
  - Bluman EM et al. (2007)
  review_status: draft
- id: tarsal-tunnel-test
  type: test
  title: Dorsiflexion-Eversion Test & Tinel for Tarsal Tunnel
  page: 2
  steps:
  - Position the patient in supine or seated with the ankle relaxed.
  - Passively take the ankle into maximal dorsiflexion and maximal eversion, and extend
    all toes.
  - Hold this end-range tension for 10–15 seconds to compress the tibial nerve within
    the flexor retinaculum.
  - Gently tap (percuss) the tibial nerve posterior and inferior to the medial malleolus.
  - Inquire regarding distal paresthesia or radiating burning into the plantar foot.
  positive: Reproduction of radiating numbness, paresthesia, or pain along the plantar
    nerve distribution (Tinel positive).
  metrics: (+) Dorsiflexion-Eversion test + Tinel at flexor retinaculum
  video_url: null
  image: null
  sources:
  - Kinoshita M et al. (2001)
  - Alshami AM et al. (2008)
  review_status: draft
- id: anterior-tarsal-tunnel
  type: test
  title: Anterior Tarsal Tunnel Syndrome Assessment
  page: 2
  steps:
  - Place patient supine with foot in relaxed position.
  - Identify the deep peroneal nerve course beneath the inferior extensor retinaculum
    on the dorsal ankle.
  - Percuss over the dorsal ankle joint line lateral to the extensor hallucis longus
    tendon.
  - Passively plantarflex and invert the foot to put the deep peroneal nerve on stretch.
  - Test light-touch sensation in the first web space (dorsal skin between 1st and
    2nd toes).
  positive: Pain or tingling radiating into the 1st interdigital web space, or hypoesthesia
    in the web space.
  metrics: Deep peroneal n., 1st web space numbness, (+) Tinel over inf. extensor
    retinaculum
  video_url: null
  image: null
  sources:
  - Borges LF et al. (1981)
  - Liu Z et al. (2014)
  review_status: draft
- id: pseudo-hallux-rigidus
  type: test
  title: Pseudo-Hallux Rigidus Test (FHL Tendinopathy)
  page: 2
  steps:
  - Position the patient in supine or seated.
  - Place the ankle in full passive plantarflexion and measure maximum passive 1st
    MTP extension.
  - Bring the ankle into full passive dorsiflexion.
  - Re-measure passive 1st MTP extension while maintaining ankle dorsiflexion.
  - Compare the available 1st MTP extension range between ankle DF and PF positions.
  positive: 1st MTP extension is normal in ankle PF but markedly restricted in ankle
    DF (indicates FHL tenodesis / tightness).
  metrics: (+) Pseudo-Hallux Rigidus test (1st MTP ext in ankle DF vs PF)
  video_url: null
  image: null
  sources:
  - Hamilton WG (1982)
  - Michelson J, Dunn L (2005)
  review_status: draft
- id: syndesmotic-high-ankle-sprain
  type: test
  title: Syndesmotic High Ankle Sprain Clinical Screen
  page: 2
  steps:
  - Palpate the anterior inferior tibiofibular ligament (AITFL) and posterior inferior
    tibiofibular ligament (PITFL).
  - Perform the Kleiger dorsiflexion-external rotation stress maneuver.
  - Perform the Hopkins mid-calf squeeze test.
  - Palpate along the anterior syndesmosis and interosseous membrane up the leg.
  - Measure the height of interosseous tenderness in centimeters above the tibiotalar
    joint line.
  positive: Focal syndesmotic tenderness, pain on external rotation or squeeze; tenderness
    height correlates directly with recovery time.
  metrics: AITFL · PITFL · Kleiger ER · Hopkins Squeeze · Interosseous tenderness
    height cm above joint line (↑ height = ↑ time to RTS)
  video_url: null
  image: null
  sources:
  - Nussbaum ED et al. (2001)
  - Hunt KJ et al. (2015)
  review_status: draft
- id: anterior-impingement
  type: test
  title: Anterior Ankle Impingement Clinical Screen
  page: 2
  steps:
  - Patient seated with knee flexed 90°.
  - Palpate along the anterior tibiotalar joint line for osteophytic ridges or soft
    tissue thickening.
  - Passively take the ankle from plantarflexion into rapid, forced full dorsiflexion.
  - Instruct the patient to perform a deep squat or lunge to load anterior joint structures
    in weight-bearing.
  - Differentiate bony impingement (hard end-feel, osteophytes) from synovial meniscoid
    lesion (soft pinching sensation).
  positive: Sharp anterior joint pain and restricted dorsiflexion on forced DF or
    lunge loading.
  metrics: Bony (tibiotalar osteophytes) · Synovial meniscoid
  video_url: null
  image: null
  sources:
  - Vannini F et al. (2015)
  - Murawski CD, Kennedy JG (2014)
  review_status: draft
- id: midportion-achilles-exam
  type: test
  title: Midportion Achilles Tendon Palpation & Differential
  page: 2
  steps:
  - Patient prone with ankles hanging relaxed over table edge.
  - Palpate the tendon from insertion up into the musculotendinous junction, focusing
    on 2–6 cm watershed.
  - Assess for localized fusiform thickening or tendon nodularity.
  - Apply pinch palpation to tender nodule while passively moving ankle through full
    dorsiflexion (Royal London test).
  - Observe whether nodule moves with tendon during active PF/DF (Arc sign).
  positive: Localized tenderness and thickening in the 2–6 cm watershed zone that
    moves during excursion.
  metrics: 2–6 cm watershed; Royal London (+ in DF) · Arc sign
  video_url: null
  image: null
  sources:
  - Maffulli N et al. (2003)
  - van Dijk CN et al. (2011)
  review_status: draft
- id: insertional-achilles-exam
  type: test
  title: Insertional Achilles & Retrocalcaneal Bursa Exam
  page: 2
  steps:
  - Position the patient in prone with foot relaxed in neutral.
  - Palpate directly on the calcaneal insertion of the Achilles tendon (enthesis).
  - Inspect and palpate for retrocalcaneal exostosis / promontory (Haglund's deformity).
  - 'Perform the 2-finger pinch test: pinch immediately anterior to the tendon insertion
    above calcaneus.'
  - Passively dorsiflex ankle to compress retrocalcaneal bursa against the calcaneus.
  positive: Point tenderness directly at the tendon insertion or exquisite pain on
    2-finger bursa pinch.
  metrics: Enthesopathy · Haglund’s · 2-Finger Pinch (bursa)
  video_url: null
  image: null
  sources:
  - Chimenti RL et al. (2017)
  - Cook JL, Purdam CR (2012)
  review_status: draft
- id: os-trigonum-test
  type: test
  title: Os Trigonum / Posterior Ankle Impingement Provocation
  page: 2
  steps:
  - Position patient prone with knee flexed 90° or extended.
  - Palpate the posterolateral talar process between the Achilles tendon and peroneal
    tendons.
  - Firmly grasp the forefoot and forcefully push the ankle into end-range passive
    plantarflexion.
  - Add slight subtalar inversion or rotation while at end-range plantarflexion (hyperplantarflexion
    test).
  - Assess for posterior joint impingement pain reproduction.
  positive: Sharp, pinching posterior ankle pain reproduced at end-range passive plantarflexion.
  metrics: Pain on forced PF
  video_url: null
  image: null
  sources:
  - van Dijk CN (2006)
  - Peace KA et al. (2004)
  review_status: draft
- id: severs-apophysitis-squeeze
  type: test
  title: Sever's Apophysitis Calcaneal Squeeze Screen
  page: 2
  steps:
  - Assess age and skeletal maturity (typically active adolescents aged 8–15 during
    growth spurts).
  - Position the patient in prone or supine with relaxed feet.
  - Grasp the posterior third of the calcaneus between the palms or thumb and index
    finger.
  - Apply firm bilateral mediolateral compression across the calcaneal apophysis.
  - Compare with vertical plantar heel strike palpation.
  positive: Sharp pain on mediolateral calcaneal compression with intact apophysis
    in skeletally immature athlete.
  metrics: Adolescents; (+) calcaneal squeeze
  video_url: null
  image: null
  sources:
  - Sever JW (1912)
  - Scharfbillig R et al. (2008)
  review_status: draft
- id: plantar-fasciopathy-palpation
  type: test
  title: Plantar Fasciopathy Palpation & Provocation
  page: 2
  steps:
  - Position the patient in supine with ankle in neutral relaxation.
  - Palpate the medial calcaneal tubercle at the plantar fascial insertion with direct
    thumb pressure.
  - Palpate along the central and medial bands of the plantar aponeurosis.
  - Passively dorsiflex the ankle and extend the 1st MTP joint to tighten the fascia.
  - Correlate with subjective first-step morning pain easing after 10–15 minutes.
  positive: Focal exquisite tenderness at medial calcaneal tubercle, reproduced on
    passive toe extension.
  metrics: Medial calcaneal tubercle; (+) Windlass test
  video_url: null
  image: null
  sources:
  - Lemont H et al. (2003)
  - Martin RL et al. (2014)
  review_status: draft
- id: baxters-nerve-exam
  type: test
  title: Baxter's Nerve Entrapment Assessment
  page: 2
  steps:
  - Position the patient in supine or seated with relaxed foot.
  - Palpate along the medial border of the abductor hallucis muscle and deep fascia.
  - Apply firm thumb pressure at the site where the first branch of the lateral plantar
    nerve crosses.
  - Test motor power of the abductor digiti minimi (5th toe abduction).
  - Verify absence of classic 'first-step' start-up heel pain to differentiate from
    plantar fasciopathy.
  positive: Maximal tenderness at medial abductor hallucis border, weakness of 5th
    toe abduction, and paresthesias.
  metrics: Medial abductor hallucis border; ADM weakness; no start-up pain
  video_url: null
  image: null
  sources:
  - Baxter DE, Thigpen CM (1984)
  - Chundru N et al. (2008)
  review_status: draft
- id: medial-calcaneal-nerve-exam
  type: test
  title: Medial Calcaneal Nerve Entrapment Palpation
  page: 2
  steps:
  - Position the patient in supine with medial heel exposed.
  - Locate the medial calcaneal nerve branches exiting the flexor retinaculum toward
    the heel pad.
  - Apply direct thumb pressure and percussion (Tinel test) over the medial calcaneus.
  - Passively dorsiflex and evert the ankle to stress nerve branches.
  - Assess for burning or dysesthesia over the medial weight-bearing heel surface.
  positive: Burning medial heel pain reproduced by percussion or focal pressure, without
    plantar fascial tenderness.
  metrics: Burning medial heel, Tinel (+)
  video_url: null
  image: null
  sources:
  - Hennrikus WL et al. (1993)
  - Rechtman AM (1956)
  review_status: draft
- id: mortons-neuroma-exam
  type: test
  title: Morton's Interdigital Neuroma Clinical Screen
  page: 2
  steps:
  - Position the patient in supine with foot relaxed.
  - Inspect and palpate the plantardigital interspaces, especially the 3rd web space
    (between 3rd and 4th MT heads).
  - Apply simultaneous plantar and dorsal pressure directly over the interdigital
    space with your thumb.
  - With the opposite hand, squeeze the metatarsal heads mediolaterally (Mulder's
    maneuver).
  - Feel for a palpable click while listening for patient pain reproduction.
  positive: Palpable click (Mulder's click) accompanied by sharp radiating pain or
    paresthesias into the adjacent toes.
  metrics: Mulder’s click; 3rd web space
  video_url: null
  image: null
  sources:
  - Mulder DJ (1951)
  - Matthews P et al. (2019)
  review_status: draft
- id: navicular-stress-fracture
  type: test
  title: Navicular Stress Fracture Palpation ('N-Spot')
  page: 2
  steps:
  - Place patient supine with foot in relaxed neutral position.
  - Identify the anterior tibialis and extensor hallucis longus tendons on the dorsal
    midfoot.
  - Palpate between the EHL and tibialis anterior tendons over the dorsal central
    third of the navicular.
  - Apply firm focal thumb pressure directly onto the dorsal navicular apex ('N-spot').
  - Assess for acute, localized point tenderness.
  positive: Exquisite point tenderness localized specifically to the 'N-spot'; requires
    urgent offloading and MRI/CT.
  metrics: “N-spot” tenderness (dorsal proximal navicular)
  video_url: https://www.youtube.com/watch?v=MgY80fa9P08
  image: null
  sources:
  - Sports Injury Physio
  - Torg JS et al. (1982)
  - Bennell KL et al. (1996)
  review_status: draft
- id: accessory-navicular-exam
  type: test
  title: Accessory Navicular / Os Tibiale Externum Palpation
  page: 2
  steps:
  - Position the patient in supine or seated.
  - Inspect the medial midfoot for a prominent bony prominence proximal to the navicular
    tuberosity.
  - Palpate the synchondrosis between the accessory ossicle and the body of the navicular.
  - Resist active foot inversion and plantarflexion to tension the tibialis posterior
    insertion.
  - Check for local footwear pressure irritation or synchondrosis disruption.
  positive: Focal point tenderness over the synchondrosis exacerbated by resisted
    tibialis posterior contraction.
  metrics: Prominent medial navicular, tender synchondrosis
  video_url: null
  image: null
  sources:
  - Lawson JP et al. (1984)
  - Leonard MA (1972)
  review_status: draft
- id: cuboid-syndrome-exam
  type: test
  title: Cuboid Syndrome Palpation & Mobility
  page: 2
  steps:
  - Position the patient in supine or prone with knee flexed 90°.
  - Identify the lateral midfoot and locate the cuboid groove adjacent to the calcaneocuboid
    joint.
  - Apply firm thumb pressure into the plantar aspect of the cuboid bone.
  - Inquire about history of plantarflexion-inversion sprain.
  - Perform passive midtarsal supination-pronation stress.
  positive: Localized pain over plantar cuboid, sensation of lateral midfoot instability,
    or decreased cuboid glide.
  metrics: Lateral midfoot, plantar cuboid tender, post-inversion
  video_url: null
  image: null
  sources:
  - Newell SG, Woodle A (1981)
  - Mooney M, Maffey-Stumph L (1994)
  review_status: draft
- id: tarsal-coalition-exam
  type: test
  title: Tarsal Coalition Clinical Screen
  page: 2
  steps:
  - Review patient demographics (adolescent aged 10–16 with recurrent ankle sprains).
  - Inspect standing posture for rigid pes planus that fails to reform an arch on
    toe standing.
  - Passively evaluate subtalar joint inversion and eversion range of motion.
  - Inspect and palpate for peroneal muscle spasm or adaptive peroneal shortening.
  - Assess calcaneonavicular or talocalcaneal joint lines for bony bridging.
  positive: Rigid subtalar joint with severe restriction of inversion/eversion, accompanied
    by peroneal spasm.
  metrics: Adolescent, recurrent sprains, rigid flatfoot, peroneal spasm, loss of
    subtalar motion
  video_url: null
  image: null
  sources:
  - Cowell HR (1975)
  - Stormont DM, Peterson HA (1983)
  review_status: draft
- id: slr
  type: test
  title: Straight Leg Raise (SLR) & Neurodynamic Screening
  page: 2
  steps:
  - Patient supine with head flat and legs relaxed in extension.
  - Grasp patient's heel and elevate the lower extremity while maintaining full knee
    extension.
  - Continuously monitor for symptom reproduction and note the hip flexion angle (positive
    35–70°).
  - 'Perform structural differentiation: lower leg slightly and add ankle dorsiflexion
    or neck flexion.'
  - Observe whether distal symptoms increase with distal/cervical neural sensitization.
  positive: Reproduction of familiar radicular leg pain between 35° and 70°, sensitized
    by ankle DF.
  metrics: Hip flex, knee ext; positive 35–70° · Familiar Sx · Structural Diff. (+)
