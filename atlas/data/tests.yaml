- id: fpi-6-test
  type: test
  title: Foot Posture Index (FPI-6) Quantification
  page: 3
  steps:
  - Patient stands relaxed in double-leg stance with arms by side, looking forward,
    feet in natural angle.
  - 'Evaluate 6 criteria: (1) Talar head palpation, (2) Supra/infra lateral malleolar
    curves, (3) Calcaneal frontal plane inversion/eversion.'
  - Evaluate (4) Talonavicular joint prominence, (5) Medial longitudinal arch congruence,
    (6) Forefoot abduction/adduction.
  - Score each item from −2 (strongly supinated) to +2 (strongly pronated).
  - 'Sum scores: total range −12 to +12.'
  positive: Score 0 to +5 = Neutral; +6 to +9 = Pronated; ≥ +10 = Highly pronated;
    −1 to −4 = Supinated; −5 to −12 = Highly supinated.
  metrics: 'Foot Posture Index (FPI-6): −12 to +12 · Neutral 0 to +5 · Pron +6 to
    +9 · Highly pronated ≥ +10 · Sup Neu Pron High'
  video_url: null
  image: null
  sources:
