- id: bfr-aop-calc
  type: info
  title: BFR Arterial Occlusion Pressure (80% AOP) & Safety
  page: 8
  steps:
  - Patient placed supine with cuff placed on the PROXIMAL THIGH only — NEVER below
    the knee (avoids common peroneal nerve compression).
  - Use vascular Doppler ultrasound on the posterior tibial artery to detect arterial
    pulse.
  - Gradually inflate cuff until arterial acoustic signal ceases; record this pressure
    as 100% Arterial Occlusion Pressure (AOP).
  - 'Calculate individualized working pressure: Working Pressure = AOP (mmHg) × 0.80
    (80% AOP).'
  - 'Active protocol: 30-15-15-15 repetitions @ 20–30% 1RM, 30 s rest between sets;
    cuff remains inflated for maximum 15–20 min continuous.'
  - 'Screen exclusions: DVT/VTE history, peripheral arterial disease (PAD), sickle
    cell trait/disease, uncontrolled hypertension, active infection, malignancy.'
  positive: Induces robust muscle hypertrophy and strength gains comparable to heavy
    resistance training using low mechanical joint loads (20–30% 1RM).
  metrics: '80% AOP Doppler calculation: AOP mmHg × 0.80 = mmHg working pressure ·
