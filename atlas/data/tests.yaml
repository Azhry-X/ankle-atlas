- id: hhd-positions
  title: Hand-Held Dynamometry (HHD) Strength & Torque Calculator
  page: 3
  type: info
  review_status: draft
  evidence: M
  summary: Standardised hand-held dynamometry (HHD) force and torque (N·m = N × m) measurement for plantarflexion, dorsiflexion,
    inversion, eversion, and hip abduction.
  steps:
  - Use the same tester, same position, and a belt / fixed set-up when possible at every visit, and compare with the other
    side (Martins 2017; Batista 2024).
  - Measure lever arm in cm (convert to m = cm ÷ 100) and peak force in Newtons (N) on the involved and uninvolved limbs.
  - Calculate Torque (N·m) = Force (N) × Lever arm (m) and Limb Symmetry Index (LSI % = involved ÷ uninvolved × 100).
  positive: Consistent test set-up (same tester, same position, belt / fixed set-up when possible) allows reliable longitudinal
    strength and LSI tracking.
  interpretation: 'Practical rule from Batista 2024 and Martins 2017: use the same device, same position, same strap / lever-arm
    point and, where possible, the same tester at every visit; compare with the other side, and do not interchange devices.'
  metrics: Same tester, same position, belt / fixed set-up when possible; do not interchange devices (Batista 2024 · Martins
    2017)
  calculator:
    kind: formula
    decimals: 2
    value_label: N·m Torque = N × lever arm (cm ÷ 100)
    expr: '(force >= 0 && lever > 0) ? (force * lever / 100) : NaN'
    inputs:
    - heading: Torque Calculator — Torque (N·m) = N × lever arm (m); enter the lever arm in cm
    - key: force
      label: Force (N)
      type: number
    - key: lever
      label: Lever arm (cm)
      type: number
    outputs:
    - when: v >= 0
      text: 'Torque: {v|2} N·m (Force {force|1} N × Lever arm {lever|1} cm) · Use same tester, same position, belt / fixed
        set-up when possible (Batista 2024; Martins 2017)'
      tone: good
  sources:
  - text: Batista 2024 Phys Ther Sport
    url: https://doi.org/10.1016/j.ptsp.2024.07.004
  - text: Martins 2017 J Athl Train
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5634229/
    free_full_text: true
- id: lsi-caution
  title: Limb Symmetry Index (LSI) Calculator
  page: 3
  type: info
