- id: ottawa-exclusions
  title: Ottawa Ankle & Foot Rules (Bachmann 2003, Dowling 2009)
  page: 1
  type: info
  review_status: draft
  evidence: H
  summary: Clinical decision rules to exclude ankle and midfoot fractures without radiography in adults and children.
  steps:
  - Palpate the posterior edge or tip of the lateral malleolus (distal 6 cm) for bone tenderness.
  - Palpate the posterior edge or tip of the medial malleolus (distal 6 cm) for bone tenderness.
  - Palpate the base of the 5th metatarsal and the navicular bone for midfoot bone tenderness.
  - Assess inability to bear weight four steps both immediately after injury and in the examination room.
  positive: X-ray is indicated if there is bone tenderness at any malleolar or midfoot zone landmark or inability to bear
    weight four steps.
  interpretation: 'Bachmann 2003 (SR, 27 studies): LR− 0.08 (0.03–0.18) ankle and 0.08 (0.03–0.20) mid-foot; children 0.07;
    < 1.4% probability of fracture at 15% prevalence; radiographs reduced by 30–40%. Dowling 2009 (children SR): pooled sensitivity
    98.5% (97.3–99.2); x-ray reduction 24.8%.'
  metrics: 'Bachmann 2003 (SR, 27 studies): LR− 0.08 (0.03–0.18) ankle and 0.08 (0.03–0.20) mid-foot; children 0.07; < 1.4%
    probability of fracture at 15% prevalence; radiographs reduced by 30–40% · Dowling 2009 (children SR): pooled sensitivity
    98.5% (97.3–99.2); x-ray reduction 24.8%'
  calculator:
    kind: formula
    decimals: 0
    value_label: Ottawa ankle & foot rule criteria positive
    expr: c1 + c2 + c3 + c4 + c5
    inputs:
    - heading: Ottawa Ankle & Foot Rule (tick any positive finding)
    - key: c1
      label: 1. Bone tenderness at posterior edge or tip of lateral malleolus (distal 6 cm)
      type: check
    - key: c2
      label: 2. Bone tenderness at posterior edge or tip of medial malleolus (distal 6 cm)
      type: check
    - key: c3
      label: 3. Bone tenderness at base of 5th MT
      type: check
    - key: c4
      label: 4. Bone tenderness at navicular
      type: check
    - key: c5
      label: 5. Unable to bear weight four steps (immediately and at assessment)
      type: check
    outputs:
    - when: v > 0
      text: 'X-ray indicated ({v|0} positive) · Bachmann 2003: LR− 0.08 (0.03–0.18) ankle and 0.08 (0.03–0.20) mid-foot; children
        0.07'
      tone: bad
    - when: v === 0
      text: 'X-ray not indicated · Bachmann 2003: LR− 0.08 (0.03–0.18) ankle and 0.08 (0.03–0.20) mid-foot; children 0.07;
        < 1.4% probability of fracture at 15% prevalence'
      tone: good
  sources:
  - text: Bachmann 2003 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC149439/
    free_full_text: true
  - text: Dowling 2009 Acad Emerg Med
    url: https://doi.org/10.1111/j.1553-2712.2008.00333.x
- id: thompson
  title: Thompson Test (Calf Squeeze Test)
  page: 1
  type: test
  review_status: draft
  evidence: M
  video_url: https://www.youtube.com/watch?v=z-7cJ7LpCqY
  video_title: Thompson Test / Achilles Tendon Rupture/Tear — Physiotutors
  summary: Prone calf squeeze test assessing integrity of the gastrocnemius-soleus-Achilles complex in suspected acute Achilles
    tendon rupture.
  steps:
  - Position the patient prone with both feet hanging relaxed off the edge of the examination table.
  - Squeeze the fleshy middle third of the calf muscle belly firmly and observe for passive ankle plantarflexion.
  - Compare the plantarflexion response with the uninvolved limb and combine with the Matles test and palpation.
  positive: Absence of passive ankle plantarflexion on calf squeeze -> same-day referral for suspected Achilles tendon rupture.
  interpretation: 'Maffulli 1998: calf squeeze (Thompson) sensitivity 0.96, Matles 0.88; at least two tests positive in all
    patients with a tear. Positive findings require same-day referral.'
  metrics: Calf squeeze (Thompson) sensitivity 0.96, Matles 0.88; at least two tests positive in all patients with a tear
    (Maffulli 1998)
  sources:
  - text: Maffulli 1998 Am J Sports Med
    url: https://doi.org/10.1177/03635465980260021801
- id: achilles-triad
  title: Achilles Rupture Clinical Tests (Thompson & Matles)
  page: 1
  type: info
  review_status: draft
  evidence: M
  summary: Combined clinical testing (Thompson calf squeeze, Matles knee-flexion test, palpable tendon gap) for acute Achilles
    tendon tear.
  steps:
  - Perform the calf squeeze (Thompson) test with the patient prone and ankles relaxed.
  - Perform the Matles test by flexing the knees in prone and observing whether the affected foot falls into neutral or dorsiflexion
    compared with the uninjured side.
  - Palpate along the Achilles tendon for a defect and arrange same-day referral when rupture is suspected.
  positive: At least two clinical tests positive in all patients with a tear (Maffulli 1998) -> same-day referral.
  interpretation: 'Maffulli 1998: calf squeeze (Thompson) sensitivity 0.96, Matles 0.88; at least two tests positive in all
    patients with a tear.'
  metrics: Calf squeeze (Thompson) sensitivity 0.96, Matles 0.88; at least two tests positive in all patients with a tear
    (Maffulli 1998)
  sources:
  - text: Maffulli 1998 Am J Sports Med
    url: https://doi.org/10.1177/03635465980260021801
- id: compartment-delta-p
  title: Compartment Syndrome of the Lower Leg
  page: 1
  type: info
  review_status: draft
  evidence: L
  summary: Emergency triage of acute lower-leg compartment syndrome after trauma, fracture, or tight cast/boot immobilisation.
  steps:
  - Screen for severe pain out of proportion to the injury, pain with passive stretch of the muscles in the compartment, paraesthesia,
    paresis, and tense compartment swelling.
  - Recognise that individual clinical signs have low positive predictive value (11% to 15%, Ulmer 2002) and maintain a low
    threshold for emergency surgical referral.
  positive: Clinical suspicion of acute compartment syndrome -> immediate same-day referral.
  interpretation: 'Ulmer 2002: positive predictive value of clinical findings 11% to 15%.'
  metrics: Positive predictive value of clinical findings 11% to 15% (Ulmer 2002)
  sources:
  - text: Ulmer 2002 J Orthop Trauma
    url: https://doi.org/10.1097/00005131-200209000-00006
- id: lisfranc
  title: Lisfranc Tarsometatarsal Joint Assessment
  page: 1
  type: test
  review_status: draft
  evidence: E
  video_url: https://www.youtube.com/watch?v=0ugLq8Ns5VU
  video_title: Line of Lisfranc / Midfoot Assessment & Mobilization — Physiotutors
  summary: Clinical examination of the tarsometatarsal (Lisfranc) joint complex after midfoot trauma or axial/twisting load.
  steps:
  - Inspect the plantar arch for midfoot ecchymosis and dorsal midfoot swelling.
  - Palpate along the tarsometatarsal joints (1st–5th MT bases) for focal tenderness or step-off.
  - Stabilise the hindfoot and apply passive dorsal-plantar translation of the metatarsal heads and gentle midfoot pronation-abduction
    stress.
  positive: Plantar midfoot ecchymosis, focal tarsometatarsal tenderness, or pain/instability on stress -> urgent imaging
    and orthopaedic referral.
  interpretation: 'Expert clinical assessment (E): suspected Lisfranc injury is a midfoot red flag requiring weight-bearing
    imaging or CT/MRI and orthopaedic referral.'
  metrics: Expert clinical assessment (E)
  sources: []
- id: charcot-neuroarthropathy
  title: 'Lower-Limb Red Flags: DVT, Septic Joint, Neuropathic / Charcot Foot, Infection & Ischaemic Foot'
  page: 1
  type: info
  review_status: draft
  evidence: E
  summary: Clinical red-flag screen for deep vein thrombosis (DVT), septic arthritis, neuropathic / Charcot arthropathy, spreading
    infection, and acute/critical limb ischaemia.
  steps:
  - 'DVT: screen for unilateral calf swelling, deep venous tenderness, warmth, pitting oedema, and immobilisation/post-op
    risk -> same-day medical referral.'
  - 'Septic joint & spreading infection: hot, swollen, erythematous joint with severe restriction of motion, systemic fever/rigors,
    or diabetic foot ulcer with cellulitis -> same-day emergency referral.'
  - 'Neuropathic / Charcot foot: warm, swollen, erythematous midfoot/ankle in a patient with peripheral neuropathy (often
    with minimal pain) -> immediate offloading and specialist referral.'
  - 'Ischaemic foot: absent pedal pulses, rest pain, pallor, coolness, or non-healing ulceration -> urgent vascular referral.'
  positive: Presence of any vascular, infective, thromboembolic, or neuropathic Charcot red flag -> same-day referral.
  interpretation: 'Expert clinical assessment (E): exclude DVT, septic joint, Lisfranc injury, neuropathic / Charcot foot,
    infection, and ischaemic foot before mechanical loading or manual therapy.'
  metrics: Expert clinical assessment (E)
  sources: []
- id: medication-safety-strip
  title: 'Medication & Safety Screen: Fluoroquinolones, Anticoagulants & EPA Contraindications'
  page: 1
  type: info
  review_status: draft
  evidence: M
  summary: Pre-treatment medication and safety check for fluoroquinolone-associated tendonitis/rupture (van der Linden 2003,
    Wise 2012), anticoagulants before dry needling (Kearns 2019), and electrophysical-agent contraindications (Houghton 2010).
  steps:
  - Screen for current or recent fluoroquinolone antibiotic exposure and concomitant oral glucocorticoids, particularly in
    patients aged over 60 years.
  - Screen for anticoagulant therapy or coagulopathy before considering dry needling (caution — possible increased incidence
    or severity of haematoma and bruising, Kearns 2019).
  - 'Screen for electrophysical-agent contraindications and precautions before applying any modality: implanted electronic
    devices, pregnancy, malignancy, recently irradiated tissue, active DVT, bleeding, and impaired sensation (Houghton 2010).'
  positive: Fluoroquinolone exposure markedly elevates Achilles tendonitis and rupture risk, especially with oral glucocorticoids
    and age > 60.
  interpretation: 'van der Linden 2003: adjusted OR 4.3 current, 2.4 recent exposure; OR 6.4 (60–79 years) and 20.4 (≥ 80
    years); 2 % to 6 % of ruptures after 60 attributable to quinolones. Wise 2012: tendonitis OR 4.3, rupture OR 2.0; stronger
    with oral glucocorticoids (OR 9.1) and age > 60 (OR 8.3). Kearns 2019: anticoagulants / coagulopathy — caution — possible
    increased incidence or severity of haematoma and bruising. Houghton 2010: agent-by-agent table (contraindicated / over
    the site / precaution / safe): implanted electronic devices, pregnancy, malignancy, recently irradiated tissue, active
    DVT, bleeding, impaired sensation.'
  metrics: 'van der Linden 2003: OR 4.3 current, 2.4 recent; OR 6.4 (60–79 years), 20.4 (≥ 80 years); 2 % to 6 % of ruptures
    after 60 · Wise 2012: tendonitis OR 4.3, rupture OR 2.0; oral glucocorticoids OR 9.1, age > 60 OR 8.3 · Kearns 2019 (E)
    · Houghton 2010 (Guideline)'
  sources:
  - text: van der Linden 2003 Arch Intern Med
    url: https://doi.org/10.1001/archinte.163.15.1801
  - text: Wise 2012 Am J Med
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3502655/
    free_full_text: true
  - text: Kearns 2019 J Man Manip Ther
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6598537/
    free_full_text: true
  - text: Houghton 2010 Physiother Can
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3031347/
    free_full_text: true
- id: ankle-sprain-prognosis-cai
  title: Ankle Sprain Incidence & Predicting Chronic Ankle Instability (Doherty 2014, Doherty 2016)
  page: 2
  type: info
  review_status: draft
  evidence: H
  summary: Epidemiological incidence of ankle sprain across sports (Doherty 2014) and early prognostic predictors of chronic
    ankle instability (CAI) after a first sprain (Doherty 2016).
  steps:
  - 'Factor sex and sport exposure: ankle sprain incidence is 13.6 in females vs 6.94 in males per 1,000 exposures, highest
    in indoor / court sports (Doherty 2014).'
  - At 2 weeks after sprain, note whether the patient can complete a drop landing and drop vertical jump (67.6% correctly
    classified for CAI; sensitivity 83%, specificity 55%, Doherty 2016).
  - At 6 months, combine Star Excursion Balance Test (SEBT) posterior reach and FAAM-ADL (84.8% classification accuracy, Doherty
    2016).
  positive: Inability to complete drop landing and drop vertical jump at 2 weeks predicts CAI with sensitivity 83%, specificity
    55% (67.6% correctly classified; Doherty 2016).
  interpretation: 'Doherty 2014 (MA, 181 studies): females 13.6 vs males 6.94 per 1,000 exposures; highest in indoor / court
    sports. Doherty 2016 (cohort): inability to complete drop landing and drop vertical jump at 2 weeks: 67.6% correctly classified
    (sensitivity 83%, specificity 55%); 6-month SEBT posterior reach + FAAM-ADL: 84.8%.'
  metrics: 'Incidence (Doherty 2014, 181 studies): females 13.6 vs males 6.94 per 1,000 exposures · CAI prediction (Doherty
    2016): 2-week drop landing / vertical jump 67.6% classified (Sn 83%, Sp 55%); 6-month SEBT posterior reach + FAAM-ADL
    84.8%'
  sources:
  - text: Doherty 2014 Sports Med
    url: https://doi.org/10.1007/s40279-013-0102-5
  - text: Doherty 2016 Am J Sports Med
    url: https://doi.org/10.1177/0363546516628870
- id: syndesmotic-high-ankle-sprain
  title: Syndesmosis Sprain — Test Combination & Acute Evaluation (Sman 2015, Baltes 2022)
  page: 2
  type: info
  review_status: draft
  evidence: M
  summary: Diagnostic test combinations and acute MRI-referenced accuracy for distal tibiofibular syndesmosis injury.
  steps:
  - Combine sensitive tests (inability to hop, syndesmosis tenderness, and dorsiflexion–external rotation stress) with specific
    findings (pain out of proportion and squeeze test) (Sman 2015).
  - Document mechanism of injury (eversion mechanism LR+ 3.47), squeeze test (LR+ 2.20, LR− 0.68), and overall clinical suspicion
    (sensitivity 73%, NPV 89%) (Baltes 2022).
  positive: 'Sensitive cluster: inability to hop, syndesmosis tenderness, dorsiflexion–external rotation stress; specific
    cluster: pain out of proportion and squeeze test (Sman 2015).'
  interpretation: 'Sman 2015: inability to hop, syndesmosis tenderness and dorsiflexion–external rotation stress (sensitive)
    + pain out of proportion and squeeze test (specific). Baltes 2022 (MRI reference): squeeze test LR+ 2.20, LR− 0.68; eversion
    mechanism LR+ 3.47; overall clinical suspicion sensitivity 73%, NPV 89%.'
  metrics: 'Sman 2015: sensitive (inability to hop, syndesmosis tenderness, DF–ER stress) + specific (pain out of proportion,
    squeeze test) · Baltes 2022: squeeze test LR+ 2.20, LR− 0.68; eversion mechanism LR+ 3.47; clinical suspicion Sn 73%,
    NPV 89%'
  sources:
  - text: Sman 2015 Br J Sports Med
    url: https://doi.org/10.1136/bjsports-2013-092787
  - text: Baltes 2022 Knee Surg Sports Traumatol Arthrosc
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9568458/
    free_full_text: true
- id: molloy-bendall
  title: Anterolateral Impingement Sign (Molloy 2003)
  page: 2
  type: test
  review_status: draft
  evidence: L
  summary: Provocation test for synovial anterolateral ankle impingement combining anterolateral gutter thumb pressure with
    passive dorsiflexion.
  steps:
  - Place the patient seated or supine with the ankle relaxed in plantarflexion.
  - Apply firm thumb pressure over the anterolateral ankle gutter.
  - Maintain thumb pressure while passively moving the ankle into full dorsiflexion.
  positive: Reproduction of anterolateral ankle pain that is greater with thumb pressure in dorsiflexion than in plantarflexion.
  interpretation: 'Molloy 2003: sensitivity 94.8%, specificity 88% for anterolateral synovial impingement.'
  metrics: Sensitivity 94.8%, specificity 88% (Molloy 2003)
  sources:
  - text: Molloy 2003 J Bone Joint Surg Br
    url: https://doi.org/10.1302/0301-620x.85b3.12873
- id: midportion-achilles-exam
  title: Midportion Achilles Tendinopathy — Palpation & Clinical Diagnosis
  page: 2
  type: test
  review_status: draft
  evidence: M
  summary: Diagnostic evaluation of midportion Achilles tendinopathy using tendon palpation, symptom location (2 to 6 cm above
    insertion), arc sign, and Royal London Hospital test.
  steps:
  - Confirm gradual onset of pain located 2 to 6 cm proximal to the Achilles tendon insertion.
  - Palpate the midportion of the Achilles tendon gently for focal tenderness and thickening.
  - Perform the arc sign and Royal London Hospital test alongside palpation.
  positive: Pain on palpation (sensitivity 84%, specificity 73%) and pain 2–6 cm above insertion (78% / 77%, Hutchison 2013).
  interpretation: 'Hutchison 2013: pain on palpation sensitivity 84%, specificity 73%; pain 2–6 cm above insertion 78% / 77%.
    Martin 2018 JOSPT CPG: in addition to the arc sign and Royal London Hospital test: "pain located 2 to 6 cm proximal to
    the Achilles tendon insertion that began gradually and pain with palpation of the midportion of the tendon" (C).'
  metrics: Pain on palpation sensitivity 84%, specificity 73%; pain 2–6 cm above insertion 78% / 77% (Hutchison 2013) · JOSPT
    CPG (C) (Martin 2018)
  sources:
  - text: Hutchison 2013 Foot Ankle Surg
    url: https://doi.org/10.1016/j.fas.2012.12.006
  - text: Martin 2018 J Orthop Sports Phys Ther (midportion Achilles tendinopathy CPG)
    url: https://doi.org/10.2519/jospt.2018.0302
- id: insertional-achilles-exam
  title: Insertional Achilles Tendinopathy & Retrocalcaneal Bursitis Exam
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Clinical differentiation of insertional Achilles tendinopathy, Haglund prominence, and retrocalcaneal bursitis
    at the posterior calcaneus.
  steps:
  - Inspect the posterior heel for bony prominence (Haglund morphology) and superficial or deep bursa swelling.
  - Palpate directly over the Achilles tendon insertion on the posterior calcaneal tuberosity.
  - Pinch-palpate immediately anterior to the distal Achilles tendon to assess the retrocalcaneal bursa and note provocation
    with ankle dorsiflexion.
  positive: Focal tenderness directly at the calcaneal insertion of the Achilles tendon or anterior retrocalcaneal recess,
    aggravated by compressive dorsiflexion.
  interpretation: Expert clinical differentiation (E) distinguishing insertional Achilles pathology from midportion tendinopathy
    (2 to 6 cm above insertion).
  metrics: Expert clinical assessment (E)
  sources: []
- id: plantar-fasciopathy-palpation
  title: Plantar Heel Pain / Plantar Fasciitis Palpation & Windlass Screen
  page: 2
  type: test
  review_status: draft
  evidence: L
  summary: Clinical assessment of plantar heel pain combining medial calcaneal tubercle palpation, first-step morning pain
    history, and the weight-bearing windlass test.
  steps:
  - Document history of plantar medial heel pain that is worst on first steps in the morning or after prolonged sitting.
  - Palpate the plantar fascia origin at the medial calcaneal tubercle and along the central band.
  - Perform the weight-bearing windlass test by passively extending the 1st MTP joint in standing.
  positive: Focal tenderness at the medial calcaneal tubercle and reproduction of plantar heel pain on windlass testing.
  interpretation: 'De Garceau 2003: windlass test was positive weight-bearing in 31.8% of patients (low sensitivity).'
  metrics: Windlass test positive weight-bearing in 31.8% of patients (low sensitivity, De Garceau 2003)
  sources:
  - text: De Garceau 2003 Foot Ankle Int
    url: https://doi.org/10.1177/107110070302400309
- id: mortons-neuroma-exam
  title: Morton's Neuroma Assessment (Thumb–Index Squeeze & Mulder's Click)
  page: 2
  type: test
  review_status: draft
  evidence: L
  summary: Clinical examination for interdigital Morton's neuroma (typically 3rd–4th interspace) using the thumb–index finger
    web-space squeeze and Mulder's click.
  steps:
  - Apply direct thumb and index finger dorso-plantar pressure into the affected intermetatarsal space (commonly the 3rd–4th
    interspace).
  - Compress the forefoot metatarsal heads mediolaterally while applying plantar thumb pressure to elicit Mulder's click.
  positive: Reproduction of forefoot burning/neuralgic pain in the interspace (thumb–index finger squeeze) or a palpable click
    (Mulder's click).
  interpretation: 'Mahadevan 2015 (ultrasound reference): thumb–index finger squeeze sensitivity 96%; Mulder''s click 61%.'
  metrics: Thumb–index finger squeeze sensitivity 96%; Mulder's click 61% (Mahadevan 2015, ultrasound reference)
  sources:
  - text: Mahadevan 2015 J Foot Ankle Surg
    url: https://doi.org/10.1053/j.jfas.2014.09.021
- id: tarsal-tunnel-test
  title: Tarsal Tunnel Syndrome Assessment (Dorsiflexion–Eversion & Tinel)
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Provocation of the tibial nerve and its plantar branches within the tarsal tunnel behind the medial malleolus.
  steps:
  - Percuss lightly along the tibial nerve posterior and inferior to the medial malleolus (Tinel sign).
  - Passively hold the ankle in maximal dorsiflexion and eversion with extension of the toes (dorsiflexion–eversion test)
    to tension the tibial nerve.
  - Map sensory changes across the medial plantar, lateral plantar, and medial calcaneal nerve territories.
  positive: Reproduction of distal burning, tingling, or numbness radiating into the plantar arch, heel, or toes.
  interpretation: Expert clinical assessment (E) used alongside neurodynamic testing (slump test) to differentiate local tarsal
    tunnel entrapment from proximal radiculopathy.
  metrics: Expert clinical assessment (E)
  sources: []
- id: pttd-staging
  title: Tibialis Posterior Tendon Dysfunction (PTTD) Assessment
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Clinical assessment of tibialis posterior tendon pain, medial arch collapse, too-many-toes sign, and single-leg
    heel-rise inversion.
  steps:
  - Inspect standing rearfoot valgus, medial longitudinal arch height, and forefoot abduction from behind (too-many-toes sign).
  - Palpate along the course of the tibialis posterior tendon behind the medial malleolus to its navicular tuberosity insertion.
  - Ask the patient to perform a single-leg heel raise and observe for medial pain and whether the calcaneus inverts normally.
  positive: Retromalleolar/navicular tenderness along the tibialis posterior tendon, weakness on resisted inversion, or failure
    of calcaneal inversion during a single-leg heel raise.
  interpretation: Expert clinical assessment (E) for adult-acquired flatfoot / tibialis posterior tendon dysfunction.
  metrics: Expert clinical assessment (E)
  sources: []
- id: severs-apophysitis-squeeze
  title: Sever's Calcaneal Apophysitis Squeeze Screen (Child)
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Mediolateral calcaneal squeeze test in skeletally immature athletes presenting with activity-related posterior
    heel pain.
  steps:
  - Position the child supine or prone with the ankle relaxed.
  - Apply firm mediolateral compression across the posterior calcaneal apophysis with both hands.
  positive: Reproduction of the child's concordant posterior heel pain upon mediolateral calcaneal compression.
  interpretation: Expert clinical assessment (E) differentiating calcaneal apophysitis (Sever's) from plantar heel pain or
    midportion Achilles tendinopathy.
  metrics: Expert clinical assessment (E)
  sources: []
- id: navicular-stress-fracture
  title: Navicular Stress Fracture Palpation ('N-Spot')
  page: 2
  type: test
  review_status: draft
  evidence: E
  video_url: https://www.youtube.com/watch?v=MgY80fa9P08
  video_title: 'Navicular Stress Fracture: Symptoms & Treatment — Sports Injury Physio'
  summary: Direct palpation of the dorsal proximal navicular ('N-spot') and 5th MT base/shaft in athletes with insidious midfoot
    or lateral foot bone stress pain.
  steps:
  - Locate the dorsal central aspect of the navicular bone between the tibialis anterior and extensor hallucis longus tendons
    ('N-spot').
  - Apply firm thumb pressure directly over the dorsal navicular cortex and compare with the uninvolved side.
  - Also palpate the proximal 5th MT shaft/base when lateral foot stress fracture is suspected.
  positive: Focal bony point tenderness over the dorsal navicular 'N-spot' or 5th MT shaft/base aggravated by hopping or running
    -> refer for imaging.
  interpretation: 'Expert clinical assessment (E): navicular and proximal 5th MT stress fractures carry non-union risk and
    require imaging and offloading.'
  metrics: Expert clinical assessment (E)
  sources: []
- id: slump-test
  title: Slump Test (Thoracic & Cervical Biased Neurodynamics)
  page: 2
  type: test
  review_status: draft
  evidence: E
  video_url: https://www.youtube.com/watch?v=HFGfP84uwEo
  video_title: The SLUMP Test / Neurodynamic Testing — Physiotutors
  summary: Seated neurodynamic test screening for lumbar radicular or sciatic/tibial/sural neural mechanosensitivity mimicking
    ankle or heel pain.
  steps:
  - Seat the patient at the edge of the plinth with thighs supported and hands behind the back.
  - Ask the patient to slump the thoracic and lumbar spine, then flex the cervical spine (chin to chest).
  - Passively extend the knee and dorsiflex the ankle, then perform structural differentiation by releasing cervical flexion.
  positive: Reproduction of the patient's distal leg, ankle, or heel symptoms that alter with cervical extension/flexion.
  interpretation: Expert clinical assessment (E) to rule in/out neurogenic contributions to posterior leg, tarsal tunnel,
    or plantar heel presentations.
  metrics: Expert clinical assessment (E)
  sources: []
- id: deltoid-ligament-sprain
  title: Deltoid Ligament Eversion Stress Test
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Palpation and passive eversion stress of the medial deltoid ligament complex after eversion or pronation-external
    rotation ankle trauma.
  steps:
  - Palpate the superficial and deep deltoid ligament attachments inferior to the medial malleolus.
  - Stabilise the distal tibia and apply a gentle passive eversion tilt to the calcaneus and talus, comparing with the uninjured
    side.
  positive: Medial ankle pain reproduction or increased eversion laxity compared with the contralateral side.
  interpretation: Expert clinical assessment (E); note that an eversion mechanism also carries LR+ 3.47 for acute syndesmosis
    injury (Baltes 2022).
  metrics: Expert clinical assessment (E)
  sources: []
- id: sinus-tarsi-syndrome
  title: Sinus Tarsi Syndrome Palpation
  page: 2
  type: test
  review_status: draft
  evidence: E
  summary: Palpation of the sinus tarsi anteroinferior to the lateral malleolus in persistent anterolateral hindfoot pain
    or subtalar instability.
  steps:
  - Locate the soft depression of the sinus tarsi immediately anterior and inferior to the lateral malleolus.
  - Apply firm thumb pressure into the sinus tarsi while gently inverting and everting the subtalar joint.
  positive: Deep focal tenderness in the sinus tarsi reproducing the patient's lateral hindfoot pain.
  interpretation: Expert clinical assessment (E) used to differentiate subtalar / sinus tarsi irritation from ATFL or syndesmotic
    sprain.
  metrics: Expert clinical assessment (E)
