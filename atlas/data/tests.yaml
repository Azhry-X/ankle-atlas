  review_status: draft
- id: hhd-positions
  type: info
  title: Hand-Held Dynamometry (HHD) Testing Positions
  page: 3
  steps:
  - 'Tibialis Posterior: patient seated/supine; test position is active inversion
    in plantarflexion; apply resistance at medial forefoot.'
  - 'Peroneus Longus: patient supine; 1st ray plantarflexion + eversion; resist under
    1st metatarsal head.'
  - 'Peroneus Brevis: patient supine; pure ankle eversion; resist lateral border of
    5th metatarsal shaft.'
  - 'Tibialis Anterior: patient seated/supine; dorsiflexion + inversion; resist dorsal-medial
    forefoot.'
  - 'Flexor Hallucis Longus (FHL): ankle neutral; test isolated hallux interphalangeal
    (IP) flexion against plantar resistance.'
  - Stabilize dynamometer firmly with rigid strap or examiner body weight; record
    Newtons (N) and normalize to Body Mass (N/kg).
  positive: Strength deficit > 10–15% compared to contralateral limb (LSI < 85–90%).
