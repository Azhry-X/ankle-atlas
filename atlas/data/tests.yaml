- id: wblt
  type: test
  title: Weight-Bearing Lunge Test (WBLT Knee-to-Wall)
  page: 3
  steps:
  - Align tape measure perpendicular to wall on floor; place big toe and heel along
    tape line.
  - Lunge forward so knee touches vertical line on wall without heel lifting from
    floor.
  - Progressively move foot backward until knee can just touch wall while heel remains
    firmly planted.
  - Record maximum distance from great toe to wall in centimeters (normative ≥ 10–12.5
    cm).
  - Optionally place digital inclinometer over anterior tibial tuberosity to measure
    tibial angle (normative 35–45°).
  positive: Distance < 10 cm, tibial angle < 35°, or bilateral asymmetry > 1.5 cm
    distance / > 4.7° inclinometer.
  metrics: WBLT Knee-to-Wall — Distance (cm) ≥ 10–12.5 cm · Asym > 1.5 cm | Inclinometer
    (°) 35–45° · Asym > 4.7°
