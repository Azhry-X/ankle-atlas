  steps:
  - 'LAS CPG 2021 (Martin 2021) — physical agents: ice with exercise (C); pulsed shortwave diathermy (C); low-level laser
    for initial pain (C); electrotherapy conflicting (D); "Clinicians should not use ultrasound for the management of acute
    ankle sprains" (A).'
  - 'Achilles CPG 2018 (Martin 2018) — other interventions: stretching (C); iontophoresis with dexamethasone for acute presentations
    (B); "should not use night splints" (C); "should not use therapeutic elastic tape" (F); heel lifts, orthoses, low-level
    laser — no recommendation, contradictory evidence (D).'
  - 'Heel Pain CPG 2023 (Koc 2023) — orthoses & night splints: "should not use orthoses ... as an isolated treatment for short-term
    pain relief" (B); orthoses combined with other treatment (C); "a 1- to 3-month program of night splints" for first-step
    morning pain (A).'
  - 'Heel Pain CPG 2023 (Koc 2023) — physical agents & scope: "should not use ultrasound to enhance the benefits of stretching"
