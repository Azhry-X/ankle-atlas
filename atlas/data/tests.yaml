- id: anterior-drawer-test
  type: test
  title: Anterior Drawer Test of the Ankle
  page: 4
  steps:
  - Patient seated with knee flexed 90° (relaxes gastrocnemius) and ankle in 10–15°
    plantarflexion.
  - Stabilize anterior distal tibia and fibula with one hand.
  - Cup the posterior calcaneus with the opposite hand and cradle the heel.
  - Draw the calcaneus and talus straight anteriorly while stabilizing the tibia.
  - Assess for anterior translation distance, dimple/suction sign, and quality of
    end-feel.
  positive: Increased anterior translation compared to contralateral side (> 3–5 mm)
    or absent/soft end-feel.
  metrics: 'Component of Van Dijk Cluster. Cluster-level accuracy only — see #van-dijk-cluster.
