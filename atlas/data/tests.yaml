  - Firmly stabilize distal tibia and fibula with proximal hand.
  - Grasp calcaneus firmly with distal hand, positioning the ankle in anatomical neutral
    (0° DF).
  - Apply a pure inversion / adduction tilting force to the talus and calcaneus.
  - Compare angular gapping and end-feel with the uninvolved limb.
  positive: Increased talar tilt (> 5–10° difference from contralateral side) or soft
    end-feel indicates CFL rupture.
