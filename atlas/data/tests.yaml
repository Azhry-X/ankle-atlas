      type: select
      options: *id003
    - key: l8
      label: 8. Performing light activities around your home
      type: select
      options: *id003
    - key: l9
      label: 9. Performing heavy activities around your home
      type: select
      options: *id003
    - key: l10
      label: 10. Getting into or out of a car
      type: select
      options: *id003
    - key: l11
      label: 11. Walking 2 blocks
      type: select
      options: *id003
