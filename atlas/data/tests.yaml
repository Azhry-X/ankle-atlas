  type: test
  title: Dorsiflexion-External Rotation Test (Kleiger Test)
  page: 4
  steps:
  - Patient seated on table edge with knee flexed 90° and lower leg relaxed.
  - Stabilize distal tibia and fibula firmly with proximal hand.
  - Hold the foot in neutral or maximal dorsiflexion with distal hand.
  - Apply an external rotation torque to the foot relative to the stabilized tibia.
  - 'Observe for pain location: syndesmotic pain is reproduced anterolaterally at
    the distal tibiofibular joint.'
