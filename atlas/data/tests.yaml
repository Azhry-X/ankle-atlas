- id: mulders-click-test
  type: test
  title: Mulder's Click (Morton's Neuroma Sign)
  page: 4
  steps:
  - Position patient supine with relaxed foot.
  - Grasp the medial and lateral aspects of the forefoot across the 1st and 5th metatarsal
    heads.
  - Apply a firm transverse compressive force, squeezing the metatarsal heads together.
  - Simultaneously press your opposite thumb upward into the plantar 3rd intermetatarsal
    space.
  - Feel and listen for a palpable click while monitoring for sharp electric pain
    into the 3rd and 4th toes.
  positive: Audible or palpable click accompanied by reproduction of familiar neuralgic
    pain or numbness in adjacent toes.
