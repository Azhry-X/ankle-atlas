    url: https://doi.org/10.2519/jospt.2021.0302
- id: atrs
  title: ATRS (Achilles Tendon Total Rupture Score)
  page: 4
  type: info
  review_status: draft
  evidence: M
  summary: Validated patient-reported outcome score evaluating symptoms and physical activity after Achilles tendon rupture
    (Nilsson-Helander 2007).
  steps:
  - Administer the ATRS to track patient-perceived symptoms and functional recovery following operative or non-operative Achilles
    tendon rupture management.
  positive: Validated patient-reported score after Achilles rupture (Nilsson-Helander 2007).
  interpretation: 'Nilsson-Helander 2007: validated patient-reported score after Achilles rupture.'
  metrics: Validated patient-reported score after Achilles rupture (Nilsson-Helander 2007)
  sources:
  - text: Nilsson-Helander 2007 Am J Sports Med
    url: https://doi.org/10.1177/0363546506294856
- id: nprs
  title: NPRS (Numeric Pain Rating Scale 0–10)
  page: 4
  type: info
  review_status: draft
  evidence: E
  summary: Unidimensional 0–10 numeric pain rating scale for current, best, and worst ankle/foot pain and load pain monitoring.
  steps:
  - Ask the patient to rate current, resting, and activity-related pain from 0 (no pain) to 10 (worst imaginable pain).
  - 'During tendon loading, apply the pain-monitoring model: pain should not exceed 5/10 on the NPRS during or immediately
    after activity and should return to pre-activity levels by the following morning (Sprague 2021).'
  positive: Low (0–2), acceptable (2–5) and high (5–10) risk zones were based on clinical experience (Cavaggion 2024).
  interpretation: 'Sprague 2021: pain should not exceed 5/10 on the NPRS during or immediately after activity and should return
    to pre-activity levels by the following morning. Cavaggion 2024: low (0–2), acceptable (2–5) and high (5–10) risk zones
    were based on clinical experience.'
  metrics: '0–10 rating scale · Pain-monitoring zones: low (0–2), acceptable (2–5), high (5–10) based on clinical experience
    (Sprague 2021; Cavaggion 2024)'
  calculator:
    kind: scale
    items: 1
    min: 0
    max: 10
    step: 1
    aggregate: sum
    decimals: 0
    value_label: / 10 NPRS Pain Rating
    item_labels:
    - Current ankle / foot pain (0 = no pain, 10 = worst imaginable pain)
  sources:
  - text: Sprague 2021 Pilot Feasibility Stud
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7905015/
    free_full_text: true
  - text: Cavaggion 2024 Open Access J Sports Med
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11616428/
    free_full_text: true
