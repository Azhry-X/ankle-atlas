- id: arc-sign-test
  type: test
  title: Arc Sign (Achilles Tendinopathy)
  page: 4
  steps:
  - Position patient in prone with feet relaxed over table edge.
  - Inspect and palpate the Achilles tendon to locate an area of localized swelling
    or nodularity.
  - Place thumb and index finger gently on the borders of the swollen area.
  - Instruct patient to actively move the ankle through full range of plantarflexion
    and dorsiflexion.
  - Observe whether the tender nodule moves with tendon excursion (intratendinous)
    or remains stationary (paratendinopathy).
  positive: The palpable swelling moves proximally and distally through an arc during
    active ankle motion.
