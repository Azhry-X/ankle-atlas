    Hébert-Losier 2017).
  interpretation: 'Hébert-Losier 2017 (10° incline, to fatigue): ICC 1.0; men median 24 vs women 21 repetitions; women over
    60 outperformed men. Martin 2018 JOSPT midportion Achilles tendinopathy CPG recommends hop and heel-raise endurance tests
    (B).'
  metrics: ICC 1.0; men median 24 vs women 21 repetitions; women over 60 outperformed men (10° incline, to fatigue; Hébert-Losier
    2017) · JOSPT Achilles CPG (B) (Martin 2018)
